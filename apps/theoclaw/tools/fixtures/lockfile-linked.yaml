lockfileVersion: '9.0'

settings:
  autoInstallPeers: true

importers:

  .:
    devDependencies:
      '@theokit/presenter':
        specifier: workspace:*
        version: link:packages/presenter

  apps/theoclaw:
    dependencies:
      '@theokit/agents':
        specifier: workspace:*
        version: link:../../packages/agents
      ws:
        specifier: 8.22.0
        version: 8.22.0
    devDependencies:
      vitest:
        specifier: 4.1.12
        version: 4.1.12

  packages/agents:
    dependencies:
      '@theokit/presenter':
        specifier: workspace:*
        version: link:../presenter
      '@theokit/sdk-tools':
        specifier: ^0.27.1
        version: 0.27.1
    devDependencies:
      '@theokit/http':
        specifier: workspace:*
        version: link:../http
      vitest:
        specifier: ^4.1.9
        version: 4.1.9

  packages/http:
    dependencies:
      undici:
        specifier: ^7.0.0
        version: 7.30.1

  packages/presenter:
    optionalDependencies:
      marked:
        specifier: ^15.0.0
        version: 15.0.0

  packages/theo:
    dependencies:
      mermaid:
        specifier: ^11.0.0
        version: 11.0.0

packages:

  ws@8.22.0:
    resolution: {integrity: sha512-x}
