# The six gates this repository declares, run on every pull request.
#
# B-015: `.github` had never existed across 383 commits. Five gates were declared in
# `package.json` and every one of them passed only when a human remembered to run it. A gate
# nobody runs is documentation.
#
# One workflow, six jobs, and every one of them blocking — deliberately. No job is allowed to
# report a failure as a pass; a job that cannot fail is the gate that motivated this file, one
# layer down. `crossval` was RED when this work
# started (31 closed items with no `fixed_in`); it was made green BEFORE this file landed, because
# a gate wired in red is a gate everyone learns to ignore.
#
# Six jobs rather than one: a single job stops at the first failure and hides the other five.
# Each pays its own `pnpm install`, which is the price of independent red/green.
#
# The count was five until 2026-09-03, when `build` was added (B-136): every other gate reads the
# SOURCE, so a repository whose bundle no longer builds passed all five. These header lines said
# five for the hour between adding the job and noticing — the same decay B-148 recorded about the
# README's test count, in the file that documents itself.
#
# pnpm rather than npm, since 2026-09-02. npm could not honour the `overrides` in
# `pnpm-workspace.yaml`'s npm twin: measured with an exact pin and a full install, it resolved
# `@theokit/sdk@4.55.0`, printed `invalid: "^4.63.3"` in `npm ls`, and exited 0. pnpm resolves the
# same manifests correctly, so CI was validating a different dependency graph than any developer
# ran. `package-lock.json` is gitignored now — the full reasoning is in `pnpm-workspace.yaml`.
#
# ---------------------------------------------------------------------------------------------
# B-062: these six checks are not required. Nothing here blocks a merge.
#
# Read "blocking" above in its narrow sense: no job reports a failure as a pass. It does NOT mean
# GitHub refuses the merge. It does not, and cannot at this tier. Measured 2026-08-19 with a token
# holding `permissions.admin: true` on this repository:
#
#   gh api repos/usetheoai-lab/TheoCode/branches/develop/protection
#     403  Upgrade to GitHub Pro or make this repository public to enable this feature.
#   gh api repos/usetheoai-lab/TheoCode/branches/main/protection
#     403  Upgrade to GitHub Pro or make this repository public to enable this feature.
#   gh api repos/usetheoai-lab/TheoCode/rulesets
#     403  Upgrade to GitHub Pro or make this repository public to enable this feature.
#   gh api orgs/usetheoai-lab/rulesets
#     403  Upgrade to GitHub Team to enable this feature.
#
# Rulesets are the newer mechanism and were measured, not assumed: refused on all three surfaces.
# There is no free-tier route to a required check on a private repository. It is a billing wall,
# not a permission we lack and not a file we forgot to write — `main` is as unprotected as
# `develop`.
#
# What holds the line today is a person waiting for six green ticks — usually. Surveyed at the
# same time: 25 merged PRs (#25 through #49, every integer in that range), none of which merged
# with a red rollup, and the six most recent merged 20-49 seconds after the last check completed.
#
# One merge landed with NO check completed, which is the reason "usually" is the honest word.
# (#34 also merged with an incomplete rollup, but a full green set had completed 74s earlier — the
# remaining entries were a duplicate run. #33 had none.) **PR #33 merged at 14:56:45Z,
# one second after its checks STARTED, with zero of them completed** (the last finished at
# 14:57:55Z). It went green afterwards, so it is not in the "merged red" count — but nothing
# gated it. The umbrella backlog records that as B-070: the merge guard read an EMPTY
# `statusCheckRollup` and matched neither IN_PROGRESS nor QUEUED, so the wait loop passed it
# through. The practice is correct; a practice is not a control, and that PR is the proof.
#
# The compensating control is that guard — B-070. The limit that FAILED on #33 is that a rollup can
# legitimately be empty, and the guard read empty as nothing-to-wait-for. A second limit, which did
# not fail here, is that it runs on one person's machine. There is no
# repository-side layer at all: `core.hooksPath` is unset and `.git/hooks` holds only samples.
#
# RESOLVED 2026-08-20 — and the stanza was made stale by its own falsifier, which is the outcome
# it was written to produce.
#
# It listed three ways out and said none had been chosen. The second — "make this repository
# public — removes the wall for free" — had ALREADY HAPPENED by the time anyone re-read it:
#
#   gh api repos/usetheoai-lab/TheoCode --jq '{private}'   ->   {"private": false}
#
# So the wall the stanza described was gone and the gap remained, not by decision but because
# nobody re-ran the check after the fact that made the fix free. Protection was configured on both
# release branches:
#
#   main, develop    required checks: test, typecheck, lint, depcruise, crossval, build
#                    enforce_admins: true, force pushes: disabled
#
# `build` was added to BOTH lists on 2026-09-10, and the six-day gap between the job existing and
# the job blocking is the finding worth keeping rather than the fix. B-136 added the job on
# 2026-09-03 because the bundle `package.json:bin` points at had been broken with nothing noticing —
# `npm run build` could not resolve @theokit/sdk. The header above was updated to say six; the
# protection was not. So the gate ran, reported, and could not refuse a merge: a PR breaking the
# bundle went red on `build` and stayed mergeable, which is the precise hole B-136 closed one layer
# down and left open here.
#
# The falsifier is one line, and running it is the only thing that separates this stanza from a
# claim about a configuration nobody re-read:
#
#   gh api repos/usetheoai-lab/TheoCode/branches/develop/protection/required_status_checks --jq .contexts
#
# THE MERGE GUARD IS NO LONGER THE CONTROL, and that is the point rather than a side effect. B-070
# is about a guard that read an empty `statusCheckRollup` as nothing-to-wait-for and merged PR #33
# one second after its checks started. A guard on one person's machine reading a field that is
# legitimately empty was always a practice standing in for a control. GitHub now refuses the merge
# server-side, where an empty rollup means "not yet" by construction rather than by predicate.
#
# The guard's predicate is still worth getting right for anything that polls (`.status` is what
# says a check has FINISHED; `.conclusion` means nothing until it has), but it is no longer the
# thing standing between a red CI and `main`.
#
# FALSIFIER — one ungated command, runnable verbatim:
#
#   gh api repos/usetheoai-lab/TheoCode/branches --jq '.[] | {name, protected}'
#
# It reports `protected: true` for `main` and `develop` today. A row flipping back to `false` means
# protection was removed and this stanza is stale in the other direction. `workspace` and feature
# branches are `false` DELIBERATELY — `rules/git-safety.md` § 1 makes `workspace` where work is
# born, and requiring a PR to reach it would leave no branch upstream to promote from.
# ---------------------------------------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # `tools/check-english-only.mjs` reads the SYSTEM word lists and exits 1 when it cannot find
      # them — "a guard that passes when it cannot check is worse than no guard, because it is
      # believed" (its own words). Those lists ship on a developer's Ubuntu and not on a runner, so
      # the gate was passing locally and failing here. Declaring the dependency is the fix;
      # weakening the guard so it reports clean without a lexicon is the defect it warns about.
      # B-073 — bounded because it hung. Measured 2026-08-19 on run 32269423670: this step sat
      # `in_progress` for 21 minutes with no output and did not respond to a cancel, blocking a PR
      # whose other four jobs were green in under two minutes. It is the only step here that talks
      # to a network mirror, so it is the only one that can hang on something outside this repo.
      # A ceiling turns an indefinite block into a fast red, which is the whole of fail-fast
      # (`rules/error-handling.md` § 1): a gate that can hang forever is a gate nobody can trust to
      # report.
      - name: Provide word lists (skip apt when the image already has them)
        run: |
          set -u
          # B-073 — ASK BEFORE INSTALLING. `check-english-only.mjs` accepts any of these paths, and
          # the runner image may already carry one; three consecutive runs on 2026-08-19 exhausted
          # every apt retry against a mirror that stalls with zero output, so an install we do not
          # need is an outage we do not need to survive. This also prints what IS present, which is
          # the measurement the workflow never made.
          echo "--- dictionaries present before any install:"
          ls -1 /usr/share/dict/ 2>/dev/null || echo "  (no /usr/share/dict)"
          ls -1 /usr/share/hunspell/ 2>/dev/null || echo "  (no /usr/share/hunspell)"

          have_en=0; have_pt=0
          for f in /usr/share/dict/american-english /usr/share/dict/words /usr/share/hunspell/en_US.dic; do
            [ -s "$f" ] && have_en=1
          done
          for f in /usr/share/dict/brazilian /usr/share/dict/portuguese /usr/share/hunspell/pt_BR.dic; do
            [ -s "$f" ] && have_pt=1
          done
          if [ "$have_en" = 1 ] && [ "$have_pt" = 1 ]; then
            echo "both dictionaries already present — apt not needed"
            exit 0
          fi
          # B-073 bullet 3 — BOTH packages, always, and the reason is a mistake worth keeping.
          #
          # This step briefly installed only what `have_en`/`have_pt` reported missing. On
          # `ubuntu-24.04` that meant `wbrazilian` alone, because `/usr/share/hunspell/en_US.dic`
          # ships with the image and `LEXICONS.en` lists that path. The install SUCCEEDED —
          # "missing (en=1 pt=0) — installing: wbrazilian", "word lists installed on attempt 1" —
          # and five `check-english-only` tests went RED that had been green on the parent commit.
          #
          # THE MEASUREMENT WAS TRUE AND ABOUT THE WRONG PROPERTY. `check-english-only.mjs`
          # ACCEPTS `en_US.dic`, which is what was measured. It does not produce the same LEXICON
          # from it: `loadLexicon` unions every path that exists, so dropping `wamerican` also
          # dropped `/usr/share/dict/american-english` AND `/usr/share/dict/words` (a
          # dictionaries-common symlink that `wamerican` owns) — 102,485 forms down to 75,798.
          # Path acceptance is not lexicon equivalence, and a gate whose verdict is a set
          # difference is decided by exactly that.
          #
          # So: install both. The download saved was real and small; the property it traded away
          # was the gate's correctness, which is not a trade. The `have_*` probe stays because
          # printing what the image carries is worth having on its own.
          pkgs="wamerican wbrazilian"
          echo "missing (en=$have_en pt=$have_pt) — installing:$pkgs"

          for attempt in 1 2 3; do
            # `timeout` per ATTEMPT, not per step: the failure is a silent stall with zero output,
            # so a whole-step ceiling can only report the death, never recover from it.
            if timeout 90 sudo apt-get update -qq \
               && timeout 90 sudo apt-get install -y -qq $pkgs; then
              echo "word lists installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed or stalled; backing off" >&2
            sleep $((attempt * 15))
          done
          echo "::error::apt could not provide$pkgs after 3 attempts." >&2
          echo "check-english-only.mjs needs a dictionary and fails closed without one, so this" >&2
          echo "job is RED rather than silently skipping the language gate." >&2
          exit 1
        timeout-minutes: 8

      # B-073 — VERIFY THE LEXICON, not the package. Added because the step above once reported
      # "word lists installed on attempt 1" while the gate it feeds had lost a quarter of its
      # English vocabulary, and five tests went red before anyone connected the two.
      #
      # "The package installed" and "the tool can build the lexicon it needs" are different
      # claims, and only the second one is the reason this step exists. Asserting a FLOOR rather
      # than an exact count: the numbers move with distro versions, and a gate that fails on a
      # dictionary getting bigger would be worse than no gate.
      - name: Verify the lexicons actually load
        run: |
          node -e '
            const { readFileSync, existsSync } = require("node:fs")
            const load = (paths) => {
              const words = new Set()
              let files = 0
              for (const p of paths) {
                if (!existsSync(p)) continue
                files++
                for (const line of readFileSync(p, "latin1").split("\n")) {
                  const w = (line.split("/")[0] ?? "").trim().toLowerCase()
                  if (w.length >= 3 && /^[a-z\u00e0-\u00ff]+$/.test(w)) words.add(w)
                }
              }
              return { files, size: words.size }
            }
            const en = load(["/usr/share/dict/american-english", "/usr/share/dict/words", "/usr/share/hunspell/en_US.dic"])
            const pt = load(["/usr/share/dict/brazilian", "/usr/share/dict/portuguese", "/usr/share/hunspell/pt_BR.dic"])
            console.log(`en: ${en.files} file(s), ${en.size} forms`)
            console.log(`pt: ${pt.files} file(s), ${pt.size} forms`)
            const FLOOR_EN = 90000, FLOOR_PT = 150000
            if (en.size < FLOOR_EN || pt.size < FLOOR_PT) {
              console.error(`::error::lexicon too small — en ${en.size} (floor ${FLOOR_EN}), pt ${pt.size} (floor ${FLOOR_PT}).`)
              console.error("The packages may have installed while the vocabulary the gate needs did not.")
              console.error("Measured 2026-08-20 on ubuntu-24.04: en 102485 with wamerican, 75798 without.")
              process.exit(1)
            }
          '
        timeout-minutes: 2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # `tools/check-english-only.mjs` reads the SYSTEM word lists and exits 1 when it cannot find
      # them — "a guard that passes when it cannot check is worse than no guard, because it is
      # believed" (its own words). Those lists ship on a developer's Ubuntu and not on a runner, so
      # the gate was passing locally and failing here. Declaring the dependency is the fix;
      # weakening the guard so it reports clean without a lexicon is the defect it warns about.
      # B-073 — bounded because it hung. Measured 2026-08-19 on run 32269423670: this step sat
      # `in_progress` for 21 minutes with no output and did not respond to a cancel, blocking a PR
      # whose other four jobs were green in under two minutes. It is the only step here that talks
      # to a network mirror, so it is the only one that can hang on something outside this repo.
      # A ceiling turns an indefinite block into a fast red, which is the whole of fail-fast
      # (`rules/error-handling.md` § 1): a gate that can hang forever is a gate nobody can trust to
      # report.
      - name: Provide word lists (skip apt when the image already has them)
        run: |
          set -u
          # B-073 — ASK BEFORE INSTALLING. `check-english-only.mjs` accepts any of these paths, and
          # the runner image may already carry one; three consecutive runs on 2026-08-19 exhausted
          # every apt retry against a mirror that stalls with zero output, so an install we do not
          # need is an outage we do not need to survive. This also prints what IS present, which is
          # the measurement the workflow never made.
          echo "--- dictionaries present before any install:"
          ls -1 /usr/share/dict/ 2>/dev/null || echo "  (no /usr/share/dict)"
          ls -1 /usr/share/hunspell/ 2>/dev/null || echo "  (no /usr/share/hunspell)"

          have_en=0; have_pt=0
          for f in /usr/share/dict/american-english /usr/share/dict/words /usr/share/hunspell/en_US.dic; do
            [ -s "$f" ] && have_en=1
          done
          for f in /usr/share/dict/brazilian /usr/share/dict/portuguese /usr/share/hunspell/pt_BR.dic; do
            [ -s "$f" ] && have_pt=1
          done
          if [ "$have_en" = 1 ] && [ "$have_pt" = 1 ]; then
            echo "both dictionaries already present — apt not needed"
            exit 0
          fi
          echo "missing (en=$have_en pt=$have_pt) — installing"

          for attempt in 1 2 3; do
            # `timeout` per ATTEMPT, not per step: the failure is a silent stall with zero output,
            # so a whole-step ceiling can only report the death, never recover from it.
            if timeout 90 sudo apt-get update -qq \
               && timeout 90 sudo apt-get install -y -qq wamerican wbrazilian; then
              echo "word lists installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed or stalled; backing off" >&2
            sleep $((attempt * 15))
          done
          echo "::error::apt could not provide wamerican/wbrazilian after 3 attempts." >&2
          echo "check-english-only.mjs needs a dictionary and fails closed without one, so this" >&2
          echo "job is RED rather than silently skipping the language gate." >&2
          exit 1
        timeout-minutes: 8

      # B-073 — VERIFY THE LEXICON, not the package. Added because the step above once reported
      # "word lists installed on attempt 1" while the gate it feeds had lost a quarter of its
      # English vocabulary, and five tests went red before anyone connected the two.
      #
      # "The package installed" and "the tool can build the lexicon it needs" are different
      # claims, and only the second one is the reason this step exists. Asserting a FLOOR rather
      # than an exact count: the numbers move with distro versions, and a gate that fails on a
      # dictionary getting bigger would be worse than no gate.
      - name: Verify the lexicons actually load
        run: |
          node -e '
            const { readFileSync, existsSync } = require("node:fs")
            const load = (paths) => {
              const words = new Set()
              let files = 0
              for (const p of paths) {
                if (!existsSync(p)) continue
                files++
                for (const line of readFileSync(p, "latin1").split("\n")) {
                  const w = (line.split("/")[0] ?? "").trim().toLowerCase()
                  if (w.length >= 3 && /^[a-z\u00e0-\u00ff]+$/.test(w)) words.add(w)
                }
              }
              return { files, size: words.size }
            }
            const en = load(["/usr/share/dict/american-english", "/usr/share/dict/words", "/usr/share/hunspell/en_US.dic"])
            const pt = load(["/usr/share/dict/brazilian", "/usr/share/dict/portuguese", "/usr/share/hunspell/pt_BR.dic"])
            console.log(`en: ${en.files} file(s), ${en.size} forms`)
            console.log(`pt: ${pt.files} file(s), ${pt.size} forms`)
            const FLOOR_EN = 90000, FLOOR_PT = 150000
            if (en.size < FLOOR_EN || pt.size < FLOOR_PT) {
              console.error(`::error::lexicon too small — en ${en.size} (floor ${FLOOR_EN}), pt ${pt.size} (floor ${FLOOR_PT}).`)
              console.error("The packages may have installed while the vocabulary the gate needs did not.")
              console.error("Measured 2026-08-20 on ubuntu-24.04: en 102485 with wamerican, 75798 without.")
              process.exit(1)
            }
          '
        timeout-minutes: 2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  depcruise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run depcruise

  # B-136 — the build had been broken and nothing noticed, because no job ran it. `npm run build`
  # could not resolve `@theokit/sdk`, so `dist/theocode.mjs` could not be produced and the smoke test
  # the README offers as the check that "touches neither the network nor a credential" was
  # unrunnable by anyone who cloned. Declaring the dependency fixed the day; this job is what stops
  # it recurring, and it runs the README's own command rather than a proxy for it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The artifacts, asserted rather than assumed: esbuild exits 0 while writing nothing if its
      # entry point resolves to an empty module, and `provider-catalog.json` is a COPY step whose
      # failure would silently disable auto-compaction in every model mode.
      - name: The build produced the artifacts it claims
        run: |
          set -euo pipefail
          for f in dist/theocode.mjs dist/provider-catalog.json dist/acp-entry.mjs; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
      # The README's smoke test, verbatim. It touches neither the network nor a credential.
      - run: node dist/theocode.mjs sessions gc

  crossval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` is load-bearing: the check resolves every `fixed_in` sha against the
      # history. A shallow clone makes real commits look like fabricated ones.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pnpm run crossval
