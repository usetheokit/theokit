<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dirty fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Entry-client script (has src=) — required by the template-html-validator
         tripwire; the upgrade-readiness scanner ignores it (only flags inline
         <script> WITHOUT src). -->
    <script type="module" src="/@theo/entry-client"></script>
    <!-- Inline <script> WITHOUT a src= attribute → `inline-script` violation
         under 0.3 enforce-CSP (no 'unsafe-inline'). -->
    <script>
      console.log('inline bootstrap, no src')
    </script>
  </body>
</html>
