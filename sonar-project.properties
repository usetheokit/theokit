# SonarQube Cloud analysis scope, generated from this repository's real layout.
#
# Source roots are stated explicitly rather than discovered. Left to discovery the scanner
# also reads build output and reports duplication between a source file and its own bundle
# — measured on theokit-tui (B-126).

sonar.projectKey=usetheokit_theokit
sonar.organization=usetheokit

sonar.sources=packages/agents-pty/src,packages/agents/src,packages/create-theokit/src,packages/http/src,packages/presenter/src,packages/tauri/src,packages/theo/src
sonar.tests=packages/agents-pty/tests,packages/agents/tests,packages/create-theokit/tests,packages/http/tests,packages/presenter/tests,packages/tauri/tests,packages/theo/tests,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.d.ts,**/*.stories.tsx,wiki/**

# Coverage-only exclusions, mirroring `vitest.config.ts` coverage.exclude.
#
# These files are still ANALYSED — bugs, smells and duplication all apply. They are simply not
# counted for coverage, because the suite deliberately does not measure them, and the note below
# about lcov paths states why that matters: a file the report never mentions comes back 0%, and
# that number is indistinguishable from a measured one.
#
# Without this the two tools disagreed and Sonar won. `public-exposure-gate.ts` has twelve passing
# unit tests and sits under `src/cli/**`, which vitest excludes; Sonar counted it as 0% on new code
# and failed the quality gate on a file whose tests were green in the same run (#544).
#
# The reported percentage will move when this lands. It should: it stops averaging in files nobody
# measured, and starts describing the code that actually is.
sonar.coverage.exclusions=\
  packages/*/src/cli/**,\
  packages/create-theokit/src/cli.ts,\
  packages/create-theokit/src/install.ts,\
  packages/theo/src/server/plugin-types.ts,\
  packages/theo/src/devtools/dom/shadow-portal.tsx,\
  packages/theo/src/devtools/dom/entry.tsx,\
  packages/agents/src/client/use-agent.ts,\
  **/types.ts,\
  **/index.ts

# Written by the coverage run. A path listed here that the build never writes reports
# 0% while the suite is green, and that number is indistinguishable from a measured one.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,packages/agents-pty/coverage/lcov.info,packages/agents/coverage/lcov.info,packages/create-theokit/coverage/lcov.info,packages/http/coverage/lcov.info,packages/presenter/coverage/lcov.info,packages/tauri/coverage/lcov.info,packages/theo/coverage/lcov.info

sonar.sourceEncoding=UTF-8
