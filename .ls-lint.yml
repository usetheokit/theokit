---
# TheoKit filename naming convention (architecture-review T1.1).
#
# Locked 2026-05-23 per Phase 2 audit's naming verdict: kebab-case
# strict for TypeScript sources, with explicit exceptions for React
# components (PascalCase) and React hooks (camelCase use*).
#
# Run: pnpm check:naming
# CI:  .github/workflows/architecture-guards.yml

# See `.claude/rules/architecture.md` v3.1 § Naming convention exceptions for
# the rationale behind the regex unions (React components PascalCase + hooks
# camelCase + type-tests acronym-prefix).

ls:
  packages/theo/src:
    # TypeScript source files — kebab-case (with hook + type-test exceptions)
    .ts: kebab-case | regex:[A-Z][A-Za-z0-9]*\.test-d | regex:use[A-Z][A-Za-z0-9]*
    # React TSX — PascalCase (components), camelCase use* (hooks), OR kebab-case
    # (for DOM bootstrap / utility tsx like entry.tsx, shadow-portal.tsx).
    # Acronym-prefix PascalCase (JSONExplorer.tsx) allowed via explicit regex.
    .tsx: PascalCase | kebab-case | regex:use[A-Z][A-Za-z0-9]* | regex:[A-Z]{2,}[A-Za-z0-9]*

ignore:
  - node_modules
  - .git
  - dist
  - packages/theo/dist
  - packages/theo/node_modules
  - packages/create-theo
  - examples
  - fixtures
  - tests
  - referencias
  - architecture-output
  - docs
  - app
  - my-test
  - my-test-bare
  - scripts
  - packages/theo/src/devtools/dev-overlay # vendored from external — preserve original case
  # As zonas de estudo read-only do ciclo (`.claude/rules/reference-provenance.md`) e as worktrees
  # efêmeras. O `ls` acima só declara `packages/theo/src`, mas o walker desce a árvore inteira antes
  # de filtrar — com o zone populado (medido: 74.502 arquivos de terceiros), o run passou de ~2,6 s
  # para 112 s e derrubou `test_check_naming_passes_today` por timeout de 30 s. O teste ficou flaky
  # conforme a zona estivesse populada ou não, que é a pior forma: verde quando ninguém está
  # pesquisando, vermelho quando alguém está. Backlog B-M67-01, item 15.
  - .claude/knowledge-base/references
  - .claude/knowledge-base/tools
  - .claude/worktrees
