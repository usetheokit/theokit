      installer's problem.

boundary_and_concurrency:
  boundary_respect:
    status: PASS
    evidence: |
      This repo's layering contract is system-design-guardrails.md § G1 (a package DAG), not a
      core/local/cloud tier split. Every new module checked:
        liveness-oracle.ts        — ZERO imports; the filesystem arrives as an injected FsSeam. Textbook DIP.
        command-template.ts       — ZERO imports.
        approval-decision.ts:33   — `import type { SandboxPosture } from '@theokit/sdk/sandbox'` (agents → sdk, allowed)
        registry-remover.ts:19    — `@theokit/sdk/errors` (allowed)
        transcript-root-hint.ts   — node:fs + ./project-index.js (intra-package)
      `pnpm check:direction` → "no cycle. Checked 30 package(s)". No G1 violation; the hook did not
      miss anything.
  concurrency:
    status: PASS
    evidence: |
      The shared resource here is the filesystem under the transcript root plus an injected async
      registry. awaitRegistryRemoval (registry-remover.ts:76-95) is a bounded Promise.race with the
      timer cleared in `finally`, and the late-settle case is argued explicitly (:63-68): a remover
      that resolves after the timeout cannot reach back into a result already built, and the failure
      direction is transcript-KEPT, which is the safe one. No read-modify-write on a shared file was
      found — recordProjectDir/persistSessionId are whole-file writes and the pointer path goes
      through the SDK's atomicWriteText. Only F-wire-23's leaf-only repair is worth changing.

pillar_a_verdict_for_the_slice: |
  NOT VERIFIED — and that is a statement about the gate, not a guess about the code.
  The /implement wiring gate resolved 0 of 27 symbols (F-wire-16), so nothing on this branch has been
  machine-confirmed. This review confirmed 15 by hand, and every one of the 8 barrel-only symbols is a
  legitimate `defer` mis-recorded as `pass` (F-wire-17) rather than the planted no-op caller the review
  was hunting: none was found. What would make it verifiable, in order of leverage:
    1. Group the checkpoint's SHAs by their declared `repo` before `git show` (F-wire-16) — this alone
       turns 0 resolved into ~20 for the in-repo half, today, with no other change.
    2. Teach check_wiring.py to exclude a barrel re-export from the pillar (a) caller set, or report it
       as a distinct `BARREL_ONLY` status. Today `export { x } from './x.js'` counts as a caller, which
