notes_on_method: |
  The framework itself is single-threaded; every hazard below is either (a) an interleaving between
  two OS PROCESSES over shared filesystem state (`~/.theokit/projects`, the `.writer.lock` lease,
  the `last-session` pointer), or (b) an interleaving between the caller's async remover and this
  package's own irreversible `rmSync`. Both are real concurrency, and both were IMPOSSIBLE before
  T2.2 made `deleteSession` / `runTranscriptGC` async — before the slice, check and use sat in the
  same uninterruptible turn.

  Two facts measured in this run that sharpen the previous review's narration:
    - `@theokit/sdk` `sessionHasWriter` (node_modules/@theokit/sdk/dist/chunk-R7TKOQMJ.js:64-72) is
      an `existsSync` on `<transcript>.writer.lock` plus a pid/host liveness check. It is a
      CROSS-PROCESS lease. Nothing in this package can observe another process taking it except by
      re-reading the file.
    - `appendJsonl` (node_modules/@theokit/sdk/dist/chunk-NACDF3PK.js:132-142) opens with `'a'`,
      which CREATES the file when absent. So deleting a transcript out from under a live writer does
      not stop the writer — it makes the session reappear containing only the records written after
      the delete. That is the concrete observable outcome for F-dom-1 and F-dom-2 below, and it is
      the same "a sequence that parses but is fiction" failure the SDK's lease exists to prevent,
      reached from the other side.

