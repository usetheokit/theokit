      Actor B = a registry that stops answering (network partition, deadlocked Agent registry).

        t0  A: sweep starts, candidate s1, `awaitRegistryRemoval(promise, 's1', NaN)`
        t1  `!Number.isFinite(NaN)` → true → `return outcome` → the async function awaits the
            thenable with no race and no timer.
        t2  B never settles.

      Observable wrong outcome: the sweep hangs forever on candidate 1 — not one session, every
      session after it, with no error and no output. That is verbatim the failure the module's own
      header (:12-17) says it exists to prevent, and the operator's config was accepted without a word.
      Note the asymmetry inside this very slice: `planTranscriptGC` REFUSES a non-finite knob
      (`!Number.isFinite(options.keepLast)`, transcript-gc.ts:164-169) rather than honouring it. Two
