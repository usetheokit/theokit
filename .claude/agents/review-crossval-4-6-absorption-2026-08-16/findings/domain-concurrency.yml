suspicions_not_findings:
  - description: >
      Two concurrent `runTranscriptGC --apply` runs over the same project take no lock. Both plan the
      same candidates, both call `removeFromRegistry` for the same id, and the second `rmSync` gets
      ENOENT, which transcript-gc.ts:308-310 counts as success. The result is inflated `removed` lists
      on both sides rather than data loss, and the newest session is protected in both snapshots.
      I could not construct an interleaving with a wrong outcome beyond the reporting inflation, so
      this is recorded as a suspicion, not a finding.
  - description: >
      PID recycling in the SDK's `reclaimable` (same-host branch decides by `process.kill(pid, 0)`)
      can make a stale `.writer.lock` read as a live lease if the pid is reused, protecting a session
      forever. The direction is fail-safe (data is kept), the code is the SDK's and not this slice's,
      and I have no evidence of it occurring. Suspicion only; flagged for the SDK, not for this branch.
