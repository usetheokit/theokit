      with a `removeFromRegistry` wired to `Agent.delete` (the wiring T2.2 exists to enable).
      Actor B = a second process (a TUI, or `exec resume`) belonging to the same operator.

        t0  A: protectedNow = resolveProtection(...)            transcript-gc.ts:271-273
            → s37 is not protected: nobody holds its lease, it is not the pointer target.
        t1  A: enters the loop; awaits the registry for s1      transcript-gc.ts:291-295
            → the registry is slow (30s ceiling each, or simply a few seconds each).
        t2  B: `acquireSessionWriter(<...>/s37.jsonl)` succeeds — the operator resumed s37.
