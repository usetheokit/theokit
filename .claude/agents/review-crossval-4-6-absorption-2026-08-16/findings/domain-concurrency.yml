  - id: F-dom-12
    severity: LOW
    status: NEW
    file: packages/agents/src/session/project-index.ts
    line: 83
    plan_ref: 'T3.2 / T2.4 — the reverse index and its secure creation'
    domain_anchor: 'session-pointer.ts:69-73 — "Delegates to `atomicWriteText`, so a reader never observes a half-written pointer"'
    summary: >
      The cwd sidecar is written with a non-atomic `writeFileSync` while its sibling in the same
      slice — the session pointer, same directory, same shared-across-processes exposure — uses
      `atomicWriteText` precisely so a concurrent reader cannot observe a partial value. A torn read
      of the sidecar returns a TRUNCATED path, and `resolveProjectDir`'s documented contract only
      covers `undefined` ("not known here"), not "a shorter path than the one that was written".
    interleaving: |
      Actor A = a process calling `recordProjectDir('/home/op/Projetos/theo/theokit')`.
      Actor B = a concurrent GC/diagnostic calling `resolveProjectDir('-home-op-Projetos-theo-theokit')`.
        t0  A: `writeFileSync(sidecar, ...)` opens `'w'` — the file is TRUNCATED to zero.
        t1  B: `readFileSync(sidecar)` → `''` → `resolveProjectDir` returns `undefined`
            (benign, matches the documented "not known here"), or, on a partial flush, a prefix such
            as `/home/op/Projetos/th` — a non-empty string that is returned as if it were the cwd.
        t2  A: finishes the write.
      Observable wrong outcome: a caller that treats the returned string as the project's cwd probes
      a path that does not exist. The window is small (one write of one short line) and there is no
      in-repo consumer of `resolveProjectDir` on a deletion path today — hence LOW — but the value is
      published as the reverse index whose stated purpose is answering "does the project behind this
      directory still exist" before deleting anything (project-index.ts:18-25).
    evidence: |
      ```ts
      // project-index.ts:82-83
      ensureSecureDir(sidecar)
      writeFileSync(sidecar, `${cwd}\n`, 'utf8')      // truncate-then-write
      ```
      versus
      ```ts
      // session-pointer.ts:103
      await (atomicWriteText as ...)(target, `${sessionId}\n`)
      ```
      `atomicWriteText` is already imported by this package and is a published `/persistence`
      pass-through, so the fix has no new dependency.
    recommended_action: >
      Use `atomicWriteText` for the sidecar as well (it is the same one-line delegation the pointer
      already makes), or state in `resolveProjectDir`'s docblock that a non-empty return may be torn
      and must be validated with `projectDirMatches` before use.

  - id: F-dom-13
    severity: LOW
    status: NEW
    file: packages/agents/src/session/gc/transcript-gc.ts
    line: 305
    plan_ref: 'M72 — "the framework ships everything that CREATES unbounded disk state and nothing that bounded it"'
    domain_anchor: '"@theokit/sdk classifySessionArtifact — four artifact kinds: transcript, writer-lock, lock-directory, temp (node_modules/@theokit/sdk/dist/persistence.js:14-21)"'
    summary: >
      The collector removes exactly one of the four artifact kinds the SDK defines. `rmSync` targets
      `transcriptPath(...)` only, so a `<id>.jsonl.writer.lock`, a `<id>.jsonl.lock` directory, or an
      atomic-write `temp` left by a process that died mid-write survives every sweep forever — and
      `listSessions` filters to `kind === 'transcript'`, so nothing ever sees them again.
    interleaving: |
      Actor A = an agent process holding the writer lease for s9 (`s9.jsonl.writer.lock` exists).
      Actor B = the sweep, with the operator passing `force`/or via the F-dom-1 race.
        t0  A is SIGKILLed. The lease file survives (release() never runs).
        t1  B collects s9: `sessionHasWriter` returns false (the pid is dead → reclaimable), so s9
            is a candidate; `rmSync` removes `s9.jsonl`.
        t2  `s9.jsonl.writer.lock` remains. No subsequent sweep lists it (not a `transcript`), no
            code deletes it.
      Observable wrong outcome: the module whose stated purpose is bounding disk state leaves
      monotonically growing residue in the directory it collects. Bounded in size (~80 bytes each),
      hence LOW — but it is unbounded in count and invisible to the only tool that looks.
    evidence: |
      ```ts
      // transcript-gc.ts:305
      rmSync(transcriptPath(plan.root, plan.cwd, candidate.id))
      ```
      ```ts
      // session-lifecycle.ts:124
      if (kind !== 'transcript') continue      // writer-lock / lock-directory / temp are dropped
      ```
      SDK classification (node_modules/@theokit/sdk/dist/persistence.js:14-21) enumerates all four
      kinds, so the framework has the vocabulary to collect them and chooses not to.
    recommended_action: >
      When a transcript is successfully unlinked, remove its sibling artifacts for the same id
      (`<id>.jsonl.writer.lock`, `<id>.jsonl.lock`, temp targets resolving to `<id>.jsonl`) with
      `force: true`, and only for the id just collected. Do NOT sweep orphan artifacts generally —
      an orphan lock whose owner is alive is protection, not residue.

