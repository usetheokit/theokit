  - id: F-dom-6
    severity: HIGH
    status: NEW (introduced by 7fea1388)
    file: packages/agents/src/session/liveness-oracle.ts
    line: 181
    plan_ref: 'T3.2 — the liveness question comes home to the package that made it hard'
    domain_anchor: 'liveness-oracle.ts:4-7 — "`/a/b` and `/a-b` produce the same name, so a directory name cannot be turned back into a path"; liveness-oracle.ts:25-28 — "Callers DELETE on `dead`"'
    summary: >
      The new recorded-cwd branch proves `dead` from the FIRST transcript in the directory whose
      recorded cwd re-encodes to the directory name — but the module's own opening premise is that a
      directory name can belong to MORE THAN ONE cwd. One transcript's cwd being gone proves the
      absence of that cwd, not of the directory, and the caller deletes the directory. The 3-of-N
      sampling (`slice(0, samples)`) makes the evidence partial by construction on any project with
      more than three transcripts.
    interleaving: |
      Two concurrent actors sharing one mutable resource — the encoded project directory — with no
      partitioning between them.

      Actor A = an agent run with `cwd = /home/op/my-app`.
      Actor B = an agent run with `cwd = /home/op/my/app`.
      `encodeProjectDir` maps BOTH to `-home-op-my-app` (`cwd.replace(/[^a-zA-Z0-9]/g,'-')`,
      liveness-oracle.ts:98-100), so `projectDirFor` (project-index.ts:62-64) points both at
      `~/.theokit/projects/-home-op-my-app/`. Both append transcripts there; both are legal users of it.

        t0  A writes  a1.jsonl  with first record `{"cwd":"/home/op/my-app", ...}`
        t1  B writes  b1.jsonl  with first record `{"cwd":"/home/op/my/app", ...}`   (B is live)
        t2  the operator deletes /home/op/my-app (project finished, disk cleaned)
        t3  a GC sweep calls `classifyProjects(['-home-op-my-app'], ...)`
            `recordedCwd` lists the directory, filters `.jsonl`, takes the first 3 in readdir order,
            and RETURNS ON THE FIRST MATCH (:181). readdir order puts a1.jsonl first.
        t4  `probe('/home/op/my-app')` → not found → verdict `dead`,
            reason "recorded cwd /home/op/my-app is gone"                 (:275)
        t5  the caller deletes ~/.theokit/projects/-home-op-my-app/ — including b1.jsonl.

      Observable wrong outcome: B's LIVE conversation history is destroyed by a verdict that carries
      positive evidence about a different project. Swap the readdir order and the same directory is
      `alive` — so the verdict is nondeterministic in the input the module never looks at.
      The same aliasing also lets `deleteSession`/`planTranscriptGC` in project A enumerate and
      collect project B's transcripts (`listSessions` reads the shared directory,
      session-lifecycle.ts:89-128) — but there the damage is bounded by age/keepLast/lease, whereas
      the `dead` verdict authorises deleting the whole directory at once.
    evidence: |
      ```ts
      // liveness-oracle.ts:167-183
      const samples = opts.transcriptSamples ?? DEFAULT_TRANSCRIPT_SAMPLES        // 3
      for (const file of entries.filter((f) => f.endsWith('.jsonl')).slice(0, samples)) {
        ...
        if (encodeProjectDir(cwd) === name) return { kind: 'found', cwd }         // :181 FIRST match wins
      }
      // liveness-oracle.ts:269-276
      at.found ? { liveness: 'alive', ... }
               : { liveness: 'dead', reason: `recorded cwd ${recorded.cwd} is gone` }
      ```
      The check at :181 is described as the guard against a stray transcript speaking for a project
      ("The recorded cwd MUST encode back to the directory it was found in", :151-153) — and it is
      exactly the check that CANNOT distinguish two legitimate cwds that encode to the same name,
      because both satisfy it.
      Tests: `liveness-oracle-recorded-cwd.test.ts:119`
      ("test_a_recorded_cwd_that_is_gone_is_the_one_thing_that_proves_dead") seeds a directory with
      ONE transcript. `:138` ("test_a_transcript_whose_cwd_does_not_encode_to_this_name_is_ignored")
      covers the stray-transcript case, which is the case the check DOES handle. No test puts two
      transcripts with two DIFFERENT cwds that both encode to the directory name in the same directory.
      Note the changeset claim this falsifies: `.changeset/liveness-oracle-recorded-cwd-major.md` —
      "A `dead` verdict now requires positive evidence of absence."
    recommended_action: >
      Make `dead` require that EVERY distinct recorded cwd found in the directory is absent, and make
      the sampling honest: if `entries.filter(.jsonl).length > samples`, the evidence is partial, so
      the strongest available verdict is `undetermined` unless every sampled cwd is absent AND the
      sample covered the directory. Concretely: collect the set of matching cwds across the samples,
      probe each, return `alive` on the first hit, `dead` only when all are absent and no sample was
      skipped, `undetermined` otherwise. Add
      `test_two_cwds_that_encode_to_the_same_directory_are_not_dead_when_one_still_exists()`.

  - id: F-dom-7
    severity: MEDIUM
    status: NEW
    file: packages/agents/src/session/liveness-oracle.ts
    line: 121
    plan_ref: 'T3.2 — classification absorbed into the framework; T2.2 — the deletion path is now async'
    domain_anchor: 'liveness-oracle.ts:25-28 — "Callers DELETE on `dead`"; transcript-gc.ts:34-36 invariant 4 (the sibling module DOES state that a plan is a snapshot)'
    summary: >
      Answering the question posed: yes — classification and deletion can observe different states,
      and the module says nothing about it. `classifyProjects` is synchronous, so its Map is a
      point-in-time snapshot of the whole sweep; the deletion that consumes it is asynchronous (the
      remover this slice made awaitable). Every verdict except the first is therefore consumed after
      an arbitrary number of awaits. Unlike `transcript-gc.ts`, which at least declares invariant 4
      and attempts a re-check, this module offers no re-validation contract, no re-check helper, and
      no caveat in a docblock that otherwise reasons carefully about the fail-safe direction.
    interleaving: |
      Actor A = a sweep: `const verdicts = classifyProjects(names, opts)` then
      `for (const [name, v] of verdicts) if (v.liveness === 'dead') { await removeFromRegistry(name); rm(dir) }`
      — the natural composition of the two symbols this slice ships together.
      Actor B = the operator.

        t0  A: classifyProjects returns; `-home-op-proj-x` → dead (its recorded cwd was absent).
        t1  A: begins deleting; each project costs one bounded await (up to 30s by
            DEFAULT_REGISTRY_TIMEOUT_MS) plus filesystem work. With the measured 10 252 `dead`
            verdicts (see F-dom-8), the tail of this loop runs minutes-to-hours after t0.
        t2  B: `git clone` / `mkdir -p /home/op/proj-x` and starts an agent there. The project is
            live again, and `recordProjectDir`/`persistSessionId` reattach to the SAME encoded
            directory (project-index.ts:62-64) — the one A is about to delete.
        t3  A: reaches `-home-op-proj-x`, still holding the t0 verdict, and deletes the directory.

      Observable wrong outcome: the transcripts of a project that exists at deletion time are
      destroyed on the strength of a verdict that was true only at t0. Re-probing costs ONE
      `fs.exists` on the recorded cwd — the module already has that primitive (`probe`, :133-140).
    evidence: |
      `classifyProjects` returns `Map<string, LivenessVerdict>` (:121-124) with no timestamp, no
      re-validation entry point, and no statement that the verdict is perishable. The docblock's
      safety reasoning (:25-32) is entirely about the classification's own fail-safe direction and
      says nothing about the interval between the verdict and the act.
