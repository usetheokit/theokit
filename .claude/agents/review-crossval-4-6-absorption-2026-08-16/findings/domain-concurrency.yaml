single_thread_caveat: |
  Stated explicitly, per the review brief. Every test in this slice's concurrency surface exercises
  ONE interleaving: the one vitest's scheduler happens to produce for a hand-built promise. Three
  properties are therefore claimed but not proven:
    - "registry FIRST, unlink second" is proven for the REJECTION path only (gc-registry-remover.test.ts:101-116,
      where a non-awaited rejection would have escaped); on the SUCCESS path the ordering assertion is
      vacuous (F-dom-6).
    - "a failure at k does not abort k+1..N" is proven by no test (F-dom-5) — every sweep fixture is
      single-candidate or uniform-outcome.
    - "protected sessions survive" is proven only when protection is stable across the whole call;
      the new await windows in deleteSession and runTranscriptGC are never exercised against
      protection that CHANGES during them (F-dom-1, F-dom-2), and for sessionHasWriter the competing
      writer is a different OS process, so this is a genuine cross-process race that no
      single-threaded reasoning about Node's event loop can rule out.
