agent: review-crossval-4-6-absorption-domain-concurrency
review_target: origin/develop..HEAD for plan crossval-4-6-absorption
domain: concurrency
verdict: NEEDS_FIXES
domain_specific_patterns_checked:
  - 'EC-3 ordering invariant: registry-FIRST, unlink-second (both call sites)'
  - 'EC-8: a remover settling after the timeout cannot affect an already-built result'
  - 'timer lifecycle in Promise.race (clearTimeout in finally; no leaked handle; no unhandled rejection from the losing branch)'
  - 'unbounded await on an injected callback (the runTranscriptGC hang class) — swept across the whole diff'
  - 'per-candidate error isolation: a failure at k must not abort k+1..N'
  - 'TOCTOU: sync->async conversion of a loop that held a protection snapshot (transcript-gc invariant 4)'
  - 'global-regex lastIndex reuse across concurrent expandCommandTemplate calls'
  - 'shared mutable budget in classifyProjects: undetermined must never degrade to dead'
  - 'memoised enumeration resolved exactly once (including on the throw path)'
  - 'per-instance vs module-level state in createPendingLedger'
  - "plan-declared '#### Concurrency tests' obligations vs tests actually shipped"
  - '.claude/rules/error-handling.md 2 (validate at the boundary; fail-fast, typed, never silent)'

method_note: |
  Static reading plus two executable probes, because assertions about Promise.race semantics and
  RegExp.lastIndex are exactly the kind that get post-rationalised:
    - probe 1 re-implemented awaitRegistryRemoval and confirmed (a) a loser that REJECTS after the
      timeout produces NO unhandledRejection (Promise.race has already subscribed to it), and
      (b) zero Timeout handles survive when the remover wins the race.
    - probe 2 confirmed String.matchAll / String.match(/g) / String.replace(/g) never leave
      lastIndex non-zero, but that matchAll COPIES lastIndex into its internal clone — so a
      poisoned lastIndex silently drops leading matches ("$1 $2".matchAll after .test() yielded
      only "$2").
  Everything below distinguishes "verified correct" from "correct only for the interleaving the
  tests happen to exercise".

findings:
  - id: F-dom-1
    severity: HIGH
    file: packages/agents/src/session/gc/transcript-gc.ts
    line: 271
    plan_ref: "T2.2 — runTranscriptGC accepts and honours a remover; plan Baseline Context lists 'The 4 GC invariants ... stay' as an invariant to preserve"
    domain_anchor: "transcript-gc.ts:31-36 invariant 4 — 'The apply phase re-checks. A plan is a snapshot, and between snapshot and delete a user can resume a session. A collector that trusts its own plan deletes the session someone just returned to.'"
    summary: >
      Invariant 4 is a single snapshot taken before a loop that is no longer atomic. Before this
      slice runTranscriptGC was synchronous, so `protectedNow` and every rmSync in the loop happened
      in one uninterruptible turn — "is safe now" was literally true. The loop now contains an
      `await` per candidate (up to registryTimeoutMs, unbounded by default), so for candidate N the
      snapshot can be minutes old, and a writer lease taken by ANOTHER PROCESS during that window
      (sessionHasWriter is a cross-process file lease, not intra-process state) is invisible. The
      invariant degraded from "is safe now" to "was safe when the sweep started" without the comment
      that states it being updated.
    evidence: |
      Post-slice (transcript-gc.ts:271-305) — snapshot once, await inside the loop:
      ```ts
      const protectedNow = options.apply
        ? resolveProtection(protectedTranscripts(plan.cwd, plan.root), options.protectedIds)
        : new Map<string, string>()

      for (const candidate of plan.candidates) {
        if (protectedNow.has(candidate.id)) continue
        ...
          await awaitRegistryRemoval(options.removeFromRegistry(candidate.id), candidate.id, options.registryTimeoutMs)
        ...
        rmSync(transcriptPath(plan.root, plan.cwd, candidate.id))
      ```
      Pre-slice (`git show origin/develop:...transcript-gc.ts:237-263`) — same snapshot, but
      `export function runTranscriptGC(...): RunTranscriptGCResult` with a fully synchronous body.
      The interleaving point is new; the guard was not adjusted for it.
      No test exercises "a session becomes protected while the sweep is awaiting candidate k".
    recommended_action: >
      Re-check protection per candidate immediately before the unlink, not once per sweep — a
      targeted check (pointer read + sessionHasWriter on that one transcript) is O(1) and does not
      require re-running the full protectedTranscripts scan. Keep the pre-loop snapshot as the cheap
      filter and add the narrow re-check as the actual gate. Add a test that flips protection (write
      the session pointer) from inside a controlled remover barrier and asserts the transcript
      survives.

  - id: F-dom-2
    severity: HIGH
    file: packages/agents/src/session/session-lifecycle.ts
    line: 225
    plan_ref: "D6 — 'Fix the shape at the framework'; T2.2 widened deleteSession to async"
    domain_anchor: "transcript-gc.ts:33-36 invariant 3/4 (an active writer lease protects its transcript, and the delete phase re-checks); SessionInUseError's own contract at session-lifecycle.ts:58-71"
    summary: >
      deleteSession acquired the same TOCTOU window as F-dom-1 and has no backstop at all. The
      protection check runs, then an unbounded (or registryTimeoutMs-long) await, then rmSync. A
      session that acquires a writer lease, or becomes the resumable pointer target, during the
      await is deleted anyway — the refusal that SessionInUseError exists to deliver never fires.
      Pre-slice this was impossible: the function was synchronous end to end.
    evidence: |
      session-lifecycle.ts:225-272
      ```ts
      if (options.force !== true) {
        const reason = protectedTranscripts(options.cwd, root).get(sessionId)   // :226  <-- check
        if (reason !== undefined) throw new SessionInUseError(sessionId, reason)
      }
      ...
      const outcome = await awaitRegistryRemoval(                               // :255  <-- yield
        options.removeFromRegistry(sessionId), sessionId, options.registryTimeoutMs)
      ...
      rmSync(transcriptPath(root, options.cwd, sessionId))                      // :272  <-- use
      ```
      `git show origin/develop:...session-lifecycle.ts:187-209` — the pre-slice body is sync, so
      check and use were in the same turn.
      Tests: every case in packages/agents/tests/unit/gc-registry-remover.test.ts passes
      `force: true`, which skips the check entirely — the protected path is never exercised
