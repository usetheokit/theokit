      barrier, taking the lease/pointer while the barrier is held.

  - id: F-dom-3
    severity: HIGH
    file: packages/agents/src/session/gc/registry-remover.ts
    line: 62
    plan_ref: "T2.2 Concurrency tests — 'remover_that_never_settles_times_out_with_a_typed_error() asserts the timeout fires and the sweep continues rather than hanging'"
    domain_anchor: "registry-remover.ts:12-17 — 'A remover that never settled hung runTranscriptGC indefinitely — not one session, every session after it, with no error, no timeout and no output.'; .claude/rules/error-handling.md 2 (recoverable vs unrecoverable; never fail silently)"
    summary: >
      The fix for the hung sweep is opt-in, and nothing in this repo opts in. `timeoutMs ===
      undefined` short-circuits to a plain unbounded await, and `registryTimeoutMs` is optional on
      BOTH callers with no default. So the shipped default behaviour is byte-for-byte the bug the
      commit "fix(session): a registry that never answered hung the entire GC sweep" claims to have
      closed. The docstring on the option states the guarantee unconditionally, which is where the
      contract and the code disagree.
    evidence: |
      registry-remover.ts:62
      ```ts
      if (!isThenable(outcome) || timeoutMs === undefined) return outcome   // unbounded await
      ```
      session-lifecycle.ts:203-207 states it as a fact, not an opt-in:
      ```
      * Ceiling on the injected remover. A registry that never answers must not hang a sweep; the
      * timeout surfaces as `registryError` and the transcript is left alone.
      readonly registryTimeoutMs?: number
      ```
      `grep -rn registryTimeoutMs` over the repo: 0 production call sites. Every occurrence is a
      test that passes it explicitly, plus tests/integration/gc-sweep-bounded.test.ts:121-132
      ("test_no_timeout_configured_keeps_the_previous_behaviour") which pins the unbounded default
      as DESIRED behaviour using a remover that returns `undefined` — i.e. it asserts the default
      is preserved without ever exercising the default against a non-settling remover (it cannot:
      that test would hang).
      Phase 5 / T5.3 hands `Agent.delete` to this seam from TheoCode's per-session.ts. If the
      adoption does not also pass a timeout, the consumer inherits the exact hang.
    recommended_action: >
      Either (a) give registryTimeoutMs a finite default (e.g. 30_000) and record the behaviour
      change in CHANGELOG under Changed — a sweep that returns an error beats a sweep that never
      returns; or (b) keep the opt-in default but make the omission loud: require the option on the
      sweep path, or emit a structured warning when a thenable outcome is awaited with no bound. In
      either case correct the docstring at session-lifecycle.ts:203-206 and transcript-gc.ts:257-262
      so it stops asserting a guarantee the default does not provide, and make T5.3 pass a timeout.

  - id: F-dom-4
    severity: MEDIUM
    file: packages/agents/src/session/liveness-oracle.ts
    line: 78
    plan_ref: "T3.2 Acceptance Criteria — 'Budget shared across the sweep'; Risk R5 (the DFS budget's measured behaviour becomes a framework invariant)"
    domain_anchor: "liveness-oracle.ts:29-32 — 'The budget is shared across the whole sweep, not per project. A bound that resets each iteration is not a bound; that is precisely what produced the 64M figure.'; .claude/rules/error-handling.md 2 (validate inputs at the system boundary)"
    summary: >
      `budget` is never validated. A non-finite budget disables the bound completely rather than
      failing: `NaN <= 0` is false and `NaN - 1` is NaN, so every `remaining <= 0` guard is dead and
      the sweep runs unbounded over the full candidate pool for every project — the 64M-syscall
      behaviour the module exists to prevent, reproduced silently. The realistic path is a CLI or
      config reading the budget as `Number(process.env.X)` / `Number(argv.budget)`, which yields NaN
      on a typo. The sibling primitive in this same slice does validate: planTranscriptGC refuses
      with `!Number.isFinite(options.keepLast)` (transcript-gc.ts:164-169), so the two GC-adjacent
      entry points disagree on whether a nonsense number is refused or honoured.
    evidence: |
      liveness-oracle.ts:78,86,124,137,143
      ```ts
      let remaining = opts.budget          // :78   no validation
      const probe = (path) => { remaining -= 1; ... }
      if (remaining <= 0) return { liveness: 'undetermined', ... }   // :124 / :143
      ```
      Probe: `NaN <= 0` -> false; `NaN - 1` -> NaN; guard never fires.
      packages/agents/tests/unit/liveness-oracle.test.ts passes only finite budgets
      (100, 30, 10, 3, 2) — the property test `test_total_fs_operations_never_exceed_the_budget`
      (:121) holds for every value it is given and says nothing about the non-finite case.
      Note the DIRECTION: budget 0 or negative degrades safely (everything `undetermined`); only
      the non-finite case fails open.
    recommended_action: >
      Refuse at the boundary, matching GCFloorError's posture: `if (!Number.isInteger(opts.budget)
      || opts.budget < 1) throw new <TypedError>(...)`. Add the negative test
      `test_a_non_finite_budget_is_refused_not_honoured()`.

