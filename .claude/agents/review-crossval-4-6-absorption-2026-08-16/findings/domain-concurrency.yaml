  - id: F-dom-7
    severity: MEDIUM
    file: packages/agents/src/config/command-template.ts
    line: 136
    plan_ref: "T3.3 Concurrency tests — '(none — single-threaded). Expansion awaits the injected shell sequentially per segment'"
    domain_anchor: "registry-remover.ts:12-17 (the unbounded-await-on-an-injected-callback bug class this slice already paid for); command-template.ts:109-111 — 'Nothing here throws. A command whose shell segment failed ... still produces a usable prompt'"
    summary: >
      The same bug shape the slice just fixed in the GC sweep is present, unfixed, in the template
      expander: an unbounded `await` on a caller-injected callback, inside a sequential loop. A
      shell segment that never settles hangs the expansion forever — and because replaceAsync awaits
      segment k before starting k+1, it also blocks every later segment and the whole prompt, with
      no error, no timeout and no output. The module's stated best-effort contract ("nothing here
      throws ... still produces a usable prompt") cannot be delivered in that case: it produces
      nothing at all. Unlike the GC seam there is not even an opt-in bound.
    evidence: |
      command-template.ts:83-99, 133-141
      ```ts
      for (const match of matches) {
        parts.push(source.slice(cursor, match.index), await resolve(match))   // :94 sequential
      ...
        const result = await deps.shell(command)                              // :136 unbounded
      ```
      TemplateDeps.shell (:56) is `(cmd: string) => Promise<ShellResult>` — no signal, no deadline,
      no cancellation token in the contract. The plan's own concurrency section for T3.3 records the
      sequential await and concludes "(none — single-threaded)" without asking what happens when a
      segment does not settle. No test covers it (the 15 tests in command-template.test.ts all use
      immediately-resolving shells).
    recommended_action: >
      Either add an optional per-segment deadline to TemplateDeps (mirroring registryTimeoutMs and
      reusing the same bounded-await helper), or add an `AbortSignal` to the shell contract and
      document that the caller owns the deadline — but say so in the docstring instead of claiming
      best-effort unconditionally. Add `test_a_shell_segment_that_never_settles_does_not_hang_the_expansion()`.

  - id: F-dom-8
    severity: LOW
    file: packages/agents/src/config/command-template.ts
    line: 30
    plan_ref: "T3.3 Concurrency tests — 'there is no shared mutable state across segments'"
    domain_anchor: '.claude/rules/architecture.md 6 (leaky/shared state); Unbreakable Rule 3 (state the limit honestly)'
    summary: >
      The plan's justification is wrong about the module, even though the code is currently safe. The
      three module-level regexes carry the `g` flag, and `lastIndex` on a global RegExp IS shared
      mutable state across every concurrent expansion in the process. It is benign TODAY only because
      every use site happens to be `matchAll` / `String.match(/g)` / `String.replace(/g)`, none of
      which leave lastIndex non-zero. The hazard is one line away: matchAll COPIES lastIndex into its
      internal clone, so a single future `.test()` or `.exec()` on PLACEHOLDER_REGEX or
      REFERENCE_REGEX would make concurrent expansions silently drop their leading placeholder or
      reference — a wrong prompt, not an error.
    evidence: |
      command-template.ts:30,36,38 — `const PLACEHOLDER_REGEX = /\$(\d+)/g`,
      `const REFERENCE_REGEX = /.../g`, `const ARGS_REGEX = /.../gi` (module scope, shared).
      Probe:
      ```
      G.lastIndex after matchAll        -> 0
      G.lastIndex after String.match(g) -> 0
      G.test("$1 $2"); G.lastIndex      -> 2
      [..."$1 $2".matchAll(G)]          -> [ '$2' ]     // leading match silently lost
      ```
      No test asserts two concurrent expandCommandTemplate calls produce independent results.
    recommended_action: >
      Either construct the regexes per call, or add a one-line comment at :30 stating that these are
      shared `g` regexes and that only lastIndex-neutral APIs (matchAll / match / replace) may be
      used on them, plus a test that runs two expansions concurrently
      (`await Promise.all([...])`) and asserts both outputs. Correct the plan's T3.3 concurrency
      note — "no shared mutable state" is not true of the module, only of the segments.

  - id: F-dom-9
    severity: LOW
    file: packages/agents/src/session/gc/registry-remover.ts
    line: 68
    plan_ref: 'T2.2 — the bounded seam'
    domain_anchor: '.claude/rules/error-handling.md 2 — validate inputs at the boundary; return explicit errors, not silent degradation'
    summary: >
      `timeoutMs` is not validated. NaN or a negative value is clamped by setTimeout to ~0, so every
      removal times out immediately: the sweep reports "timed out" for every session, collects
      nothing, and leaves the disk exactly as it was. The direction is fail-safe (nothing is
      deleted), but the failure is silent-by-shape — an operator sees a GC that runs, reports errors
      that look like a registry outage, and never collects, with no hint that the configured timeout
      was garbage.
    evidence: |
      registry-remover.ts:63-72 — timeoutMs flows straight into setTimeout with no check.
      Probe: `setTimeout(fn, NaN)` fires after ~1ms; `setTimeout(fn, -5)` fires immediately.
      Same env-parsing path as F-dom-4 (`Number(process.env...)`).
    recommended_action: >
      Guard at the top of awaitRegistryRemoval: a `timeoutMs` that is not a finite positive number is
      refused with a typed error naming the received value, rather than becoming an
      instantly-expiring bound.

