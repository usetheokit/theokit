verdict_input:
  blockers: 1
  high: 2
  medium: 7
  low: 5
  info: 1
  recommendation: NEEDS_FIXES
  rationale: >-
    The framework-side work is of high quality and the blocked tasks are
    blocked for real — I verified both the sdk-tools tarballs and the registry
    state independently rather than accepting the log. Three things stop this
    from being a clean cross-validation pass, and two of them are cheap to fix.
    (1) The Goal's own metric is unmet and is reported in a way that reads as
    met; the fix is a sentence, not code. (2) Two published functions became
    async while the DoD, the ADR that authorised them and the CHANGELOG's
    section structure all still say "widening/minor" — left alone, the release
    ships a breaking change as 9.5.0 to a consumer pinned ^9.4.0. (3) One
    declared deliverable, readUserTurnPreviews, is simply absent while a
    Coverage Matrix row asserts it as a resolution. The remaining MEDIUMs are
    Acceptance Criteria that were overtaken by defensible re-scopes and never
    rewritten — individually small, collectively the reason a future reader
    cannot tell a delivered task from a redefined one.
