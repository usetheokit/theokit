    summary: >-
      The sunset date D8 fixes — itself a MUST-FIX correction from the
      edge-case review — is absent. The allowlist uses 2026-11-14 and the gate
      script carries no sunset at all, so its warn mode has no forcing function.
    evidence: |
      grep -rn "2026-11-13" over scripts/check-invention-reachability.mjs,
      scripts/lib/invention-reachability.mjs and
      .claude/rules/invention-reachability-allowlist.txt → no matches. Both
