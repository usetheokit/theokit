  - id: F-tests-3
    severity: MEDIUM
    file: packages/agents/tests/unit/liveness-oracle.test.ts
    line: 211
    plan_ref: EC-9 (symlink loop); rules/testing.md § 6 (a test that asserts nothing meaningful)
    summary: >
      `test_a_repeating_candidate_list_costs_its_distinct_entries_not_its_length` does not
      verify the property in its own name. Deleting the de-duplication from searchPool leaves
      the whole suite green. The rewrite renamed the test to CLAIM the dedup property while
      removing the only assertion (`toBe('dead')`) that varied with it — so the name now
      asserts more than the body can.
    evidence: |
      Mutation applied to packages/agents/src/session/liveness-oracle.ts:213-214
        -      if (seen.has(candidate)) continue
        -      seen.add(candidate)
      Result: Test Files 2 passed (2) | Tests 19 passed (19).  Mutant survives.

      Why both assertions are inert here:
        expect(fs.calls()).toBeLessThanOrEqual(10)  — the budget already guarantees this and
          it is asserted independently at :197 (test_total_fs_operations_never_exceed_the_budget).
          With or without dedup no probe fires at all, because encodeProjectDir('/loop/a/b/a/b')
          never equals encode('/loop/target') — the loop `continue`s before probe() and
          `remaining` is never decremented.
        expect(...liveness).toBe('undetermined')    — produced identically by "pool did not
          contain it" and by "budget exhausted"; the test does not assert `reason`, so it
          cannot tell the two apart.
    recommended_action: >
      Make the list repeat a candidate that DOES encode to the target and does not exist, with
      a budget smaller than the list length: with dedup the pool is exhausted within budget and
      `reason` is "no candidate path matched…"; without it, `reason` is "search budget
      exhausted". Assert `reason`, not just the verdict.

