verdict_input: |
  NEEDS_FIXES — 1 BLOCKER, 2 HIGH.

  The two carried-over items split cleanly. F-tests-1 is genuinely FIXED, and fixed better than
  recommended: the guard was moved to `afterAll` (order-independent by construction) rather than
  reordered, extracted into tests/lib/refuse-mostly-skipped.ts with 5 direct unit tests, and I
  reproduced the failing behaviour empirically rather than accepting the commit message.
  F-tests-2 is UNCHANGED: 3 of 4 tests still skip, T1.2's GREEN never happened, and nothing
  expires — while the repo already ships the sunset mechanism that would fix it
  (check-surface-parity.mjs:190-208).

  On the fresh work, the answer to "was the rewrite faithful?" is: mostly yes, with one
  mutation-proven exception.

  Faithful, and I will say so specifically. The verdict change on
  test_a_project_that_is_really_gone_is_dead was a SPLIT, not a deletion: the `dead` case
  survives with a stronger precondition (oracle.test.ts:132, plus an assertion on `reason`) and
  the old behaviour got its own explicit test asserting the new answer (:148). The symlink-cycle
  counter-argument is sound rather than a rationalisation — the original rested on "completeness
  of the enumeration is the enumerator's guarantee", which a real-tree measurement falsified
  6-of-6, and the change moves the verdict from destructive (`dead` -> caller deletes) to
  conservative. Changing a test in the fail-safe direction, with the old premise empirically
  refuted and the remaining `dead` branch pinned harder, is a migration.

  What was actually weakened is elsewhere, and it is not what the commit message flags.
  F-tests-B: the "unreadable" test was retargeted from `exists` to `listEntries`, and the
  stat-error branch it used to guard is now dead. I mutated `probe()` so a throw reads as
  "absent" — the exact shape of "live project classified dead" — and all 19 tests stayed green,
  while the pre-rewrite suite caught it. F-tests-3: the dedup property can be deleted entirely
  with the suite still green, and the rewrite renamed the test to claim that property.

  The BLOCKER is not in the rewritten suites at all — it is the integration test they left
  behind. tests/integration/liveness-oracle-real-tree.test.ts still calls the deleted API, is
  RED on HEAD, and is the sole cause of the branch's own typecheck gate being RED. The
  checkpoint still records T3.2 pillar (b) as true. That is F-wire-1's pattern — a verification
  surface that was not re-run — reproduced by the commit that was closing F-arch-1.

  Yes, there is real duplication (F-tests-7: 5 of 8 added tests duplicate the rewritten suite,
  including a byte-identical test name), and the new Goal-metric register carries three
  assertion-free placeholders (F-tests-4) plus a CI-red environment dependency (F-tests-C).

  .wiring-evidence.json discloses its manual provenance thoroughly to a human and not at all to
  check_wiring.py, which reads `evidence.get(metric, 0)` and nothing else. The skill's
  prohibition on hand-written evidence is categorical; the honesty of the file does not lift it.
