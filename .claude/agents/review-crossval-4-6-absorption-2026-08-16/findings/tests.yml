verdict: NEEDS_FIXES
verdict_rationale: >
  The branch's tests are, on average, unusually good — the docblocks argue their own necessity,
  the fixtures are mostly non-vacuous, and one of them (the GC two-session note) catches exactly
  the failure class this review was commissioned to find. But three of them are hollow in ways
  that matter: the EC-4 guard against vacuous runs is itself vacuous (F-tests-1, BLOCKER), T1.2's
  assertions are 75% skipped with no expiry while neither branch of its decision gate was
  executed (F-tests-2), and the EC-14 / T2.7 / EC-18 edge cases the plan declared as RED tests
  were not written (F-tests-3, -5, -9). Combined with zero RED-first commits (F-tests-6), the
  suite currently cannot support the claim that it would have caught the defects it describes.
