    line: 52
    plan_ref: 'T3.2 Pseudo-code (`opts: { listProjects; budget; fs?: FsSeam }`)'
    summary: '`fs` is required where the plan declared it optional, so every consumer must restate the same one-line `existsSync` adapter.'
