  - id: F-arch-18
    severity: INFO
    file: packages/agents/src/bridge/approval-decision.ts
    line: 73
    plan_ref: T2.1
    summary: 'No issues found — correct placement, correct openness, fail-closed default.'
    evidence: |
      A pure function over its arguments with no state, a type-only import from `@theokit/sdk/sandbox`
      (no runtime coupling, G2/sdk-runtime.md respected), and an exhaustive `switch` over a
