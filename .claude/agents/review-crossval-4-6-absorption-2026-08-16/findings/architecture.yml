      }
      ```
      The doc at :57-59 even tells the caller to use `projectsRoot()` "rather than joining the segment
      by hand — that segment had three owners once" while the module then joins by hand itself. A
      `\` separator on Windows makes the two disagree.
    recommended_action: 'Import `join` from `node:path` (the module already runs in Node — the fs is injected for budgeting, not for portability) or take `projectDirFor`-style path construction as part of the seam. Either way, one function should build this path.'

