    severity: MEDIUM
    file: 'packages/agents/src/session/liveness-oracle.ts'
    line: 156
    plan_ref: 'rules/architecture.md § 3 (one owner per question); G12'
    summary: 'The projects-directory path is built by string concatenation here and by `join(projectsRoot(root), encodeProjectDir(cwd))` one file away — a third representation of the same on-disk layout rule, and non-portable.'
    evidence: |
      ```ts
