  - id: F-arch-9
    severity: MEDIUM
    file: 'packages/agents/src/session/liveness-oracle.ts'
    line: 43
    plan_ref: 'ADR D5; T3.2 "Deep Dives — the shared budget"'
    summary: '`firstLine` carries no cost contract and no shipped adapter, so the module''s "costs one line of one file" claim is unenforceable and the budget counts a possibly-whole-file read as one operation.'
    evidence: |
      ```ts
