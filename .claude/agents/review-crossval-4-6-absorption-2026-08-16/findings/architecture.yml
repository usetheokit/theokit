summary:
  blocker: 0
  high: 2
  medium: 7
  low: 7
  info: 9
  verdict_input: >
    Two HIGH findings. F-arch-1 (duplicated `encodeProjectDir` inside the absorbed liveness oracle)
    is the material one: its failure mode is classifying live projects `dead`, and the caller of a
    `dead` verdict deletes transcripts. F-arch-2 (a fake `ReadonlyMap` behind an `as` assertion) breaks
    substitutability between two exports of the same declared type on the package's new public surface.
    Both are small, local fixes. The MEDIUM band is dominated by mechanism gaps in the very machinery
    this plan built to close mechanism gaps: an undecided subpath the plan itself created (F-arch-6),
    unchecked `.d.mts` twins (F-arch-7), and a deliberately duplicated tool-name list with no cross-repo
    check that is already stale (F-arch-3).
