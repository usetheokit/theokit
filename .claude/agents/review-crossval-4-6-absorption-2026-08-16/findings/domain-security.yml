  - id: F-dom-8
    severity: LOW
    file: packages/agents/src/bridge/approval-decision.ts
    line: 79
    plan_ref: 'T2.1 — the callable predicate as published surface (bridge/index.ts:82)'
    domain_anchor: "rules/error-handling.md § 2 — 'return explicit errors, not magic values'; § 5 anti-pattern list"
    summary: >-
      The exhaustive switch has no runtime default. A JS consumer, or a `mode` read from user config
      without `parseApprovalMode`, falls off the end and receives `undefined` from a function whose
      declared return type is `boolean`.
    evidence: |
      ```ts
      export function shouldAutoApprove(mode: ApprovalMode, …): boolean {
        switch (mode) {
          case 'suggest':   return false
          case 'auto-edit': return …
          case 'full-auto': return posture?.enforced === true
        }        // <- no default; `shouldAutoApprove('yolo' as any, 'run_shell')` === undefined
      }
      ```
      Fail-closed under `if (…)`, but not under `=== false`, `!== true` inversions, or a JSON round
      trip. The symbol is published (`packages/agents/src/bridge/index.ts:82`), so untyped callers are
      a real population.
    recommended_action: >-
      Add `default: return false` with a one-line comment (an unknown mode is not a mode we can
      auto-approve under), or throw a typed `ConfigurationError`. Add a negative test passing an
      out-of-union string.

