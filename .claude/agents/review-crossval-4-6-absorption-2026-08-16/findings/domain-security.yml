verified_no_finding:
  - check: 'single-pass inertness — shell output and file content are never re-scanned'
    result: PASS
    evidence: >-
      `replaceAsync` (command-template.ts:83-99) materialises `[...source.matchAll(pattern)]` against
      the ORIGINAL string before any replacement is produced, then stitches by slice/cursor. A
      replacement is structurally unreachable by the pattern. Both directions are pinned by tests
      (command-template.test.ts:106-115 shell output, :119-130 file content). `matchAll` constructs a
      fresh regex per call, so the module-level `/g` `lastIndex` cannot leak between invocations.
  - check: 'ReDoS on REFERENCE_REGEX'
    result: PASS
    evidence: >-
      `/!`(?<cmd>[^`]+)`|(?<!\S)@(?<file>[^\s`,]*[^\s`,.])/g`. The `X* X` tail backtracks at most
      once per character and the `(?<!\S)` lookbehind restricts start positions to whitespace-preceded
      `@`. Measured on node: `@` + 60 000 dots = 0.15 ms; 2 000 references = 1.7 ms; unterminated
      `` !` `` + 100 000 chars = 0.14 ms. Linear. The nested-quantifier ancestor
      (`\.?[^\s`,.]*(?:\.[^\s`,.]+)*`, still live in TheoCode's copy) is genuinely gone.
  - check: 'the expander never spawns and never opens a file'
    result: PASS
    evidence: >-
      Only `deps.shell` / `deps.readFile` are called (command-template.ts:136, :145). No
      `node:child_process` or `node:fs` import in the module. The file name is handed over verbatim —
      no join/normalise/realpath — pinned at command-template.test.ts:161-184, which is the correct
      call: a second containment check that disagrees with the first is worse than none.
  - check: 'an absent posture never auto-approves'
    result: PASS
    evidence: >-
      `full-auto` requires `posture?.enforced === true` (approval-decision.ts:88) — optional chaining
      makes `undefined` and `{enforced:false}` both false. `suggest` is unconditionally false.
      `applyPosture` (approval-posture.ts:177) routes its runtime refusal through the same predicate,
      so the M77 fail-closed throw and the per-event predicate cannot drift. Caveat recorded as
      F-dom-7 for the `auto-edit` branch.
  - check: 'ensureSecureDir does not chmod toward $HOME'
    result: PASS
    evidence: >-
      `dirname(filePath)` is computed once and every `statSync`/`chmodSync` targets that single `dir`
      (secure-store.ts:55-73). There is no loop and no parent walk. Residual ancestor risk recorded
      separately as F-dom-4.
  - check: '@theokit/sdk/mcp-auth transitive closure and _resetForTests exclusion'
    result: PASS
    evidence: >-
      `src/mcp-auth.ts` re-exports exactly six names (`refreshAccessToken`, `runPkceFlow`,
      `getTokens`, `lockedRefresh`, `setTokens`, type `OAuthTokens`). `_resetForTests`
      (token-storage.ts:139) is not among them and is asserted absent from the built entry at
      `packages/sdk/tests/mcp-auth-subpath.test.ts:107-109`. The only other module reached is
      `errors.js`, already public. No `stripInternal` is configured, so the `@internal` JSDoc on the
      re-exported symbols does not silently erase their declarations.
  - check: '.d.mts declarations match their .mjs implementations'
    result: PASS
    evidence: >-
      Four pairs read side by side. `declared-exports.d.mts` ↔ `.mjs:62` — same arity, same
      `{names, unresolvedForwards}` return, and the comment correctly records that `typeCandidates`
      is deliberately unexported. `invention-reachability.d.mts` ↔ `.mjs:55` — `InventionFinding`
      fields match the object literal at `.mjs:102-108` exactly, including `allowlistExpired`.
      `changelog-closes.d.mts` ↔ `.mjs:34` — `MissingClose` matches `.mjs:55`, and the declared
      "reads [Unreleased] only" is enforced at `.mjs:20-26`. `boundary-decisions.d.mts` ↔ `.mjs:35` —
      `'forward' | { out: string }` is the literal shape used. No declaration promises a symbol,
      field or narrowing the implementation does not deliver.
  - check: 'no secret, token or credential in the 74 commits across the three repos'
    result: PASS
    evidence: >-
      Pattern sweep over `git diff origin/develop..HEAD` and over every commit message in all three
      repos for `npm_*`, `_authToken`, `//registry.npmjs.org/:_auth`, `NPM_TOKEN=`, `sk-*`, `ghp_*`,
      `github_pat_`, `AKIA*`, PEM private-key headers, and for assigned `password|secret|api_key|token`
      literals: ZERO hits outside prose. The two `_authToken` occurrences are the plan's own Risk-R1
      narrative describing a STALE token's `E401` — the word, never a value. No `.npmrc`, `.env`,
      `.pem` or `.key` is tracked in `theokit` or `theokit-sdk`; the `.env.example` files carry no
      values. `theokit-tui/.npmrc` is tracked and verified token-free across its whole history
      (hygiene risk recorded as F-dom-9).

honest_limitations:
  - "F-dom-1's impact depends on which tool names TheoCode's registry exposes at adoption time; measured against TheoCode HEAD on branch workspace (registry.ts:41-42, 88-91). If the registry changes before T5.1 lands, re-measure."
  - 'F-dom-2/F-dom-3/F-dom-4 assume a multi-user POSIX host. On a single-user laptop the group/world-write exposure is theoretical; the plan itself treats `umask 002` as the real-machine case, which is why they are not downgraded.'
  - "F-dom-5's severity turns on whether any surface builds `rawArgs` from non-human input. I could not find such a call site in-repo (`expandCommandTemplate` has zero production callers here — only config-entry.ts:78 re-exports it), so the finding is about an unenforced contract on a published API, not a demonstrated exploit."
  - 'Regex analysis is manual plus empirical timing, not a formal ReDoS proof. The measured curve is linear over four input sizes; a pathological input outside the shapes tried cannot be ruled out formally.'
