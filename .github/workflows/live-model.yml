# A real model on every push to develop (B-415, OBJ-9). The preflight sends one request to
# OpenRouter and prints why the job could not run; the live suite then runs with the key
# required, so an absent key or an unreachable provider ends red with its reason, never green.
#
# No run group is declared: by default GitHub keeps one pending run per group and cancels it when
# another push arrives, and even a longer pending queue is a bound, so any shared group can drop
# pushes. Every push gets its own run (D7).
name: Live model

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-model:
    name: Live model (real provider)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One model for the preflight and both live steps. The default must equal DEFAULT_LIVE_MODEL in
    # scripts/live-model.mjs, which the preflight re-exports; the workflow test pins that.
    env:
      LIVE_MODEL: ${{ vars.LIVE_MODEL || 'google/gemini-2.5-flash-lite' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job handles the provider key, so ADR-0021 pins the action by commit (loop-code-review #67).
      - uses: usetheokit/shared-workflows/actions/setup@95ef5a1ea79f0c4065fa7ca0466b0b07b4c7799d # v1
      - name: Preflight (reach the provider)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/live-model-preflight.mjs
      - name: Build the live suite's workspace dependencies
        run: node scripts/live-model-build.mjs agents
      - name: Live suite (THEOKIT_LIVE_REQUIRED)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THEOKIT_LIVE_REQUIRED: '1'
        # bash -eo pipefail: the suite's exit code survives the pipe (D8)
        shell: bash
        run: pnpm --filter @theokit/agents test:live 2>&1 | node scripts/redact-key-shapes.mjs
      # The A2A real-model test (B-407) lives in TheoCode, whose ci.yml job holds no key, so there it
      # skipped green on every push. Run here with the key required, the same way as the suite above.
      - name: A2A live test (THEOKIT_LIVE_REQUIRED)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THEOKIT_LIVE_REQUIRED: '1'
        # bash -eo pipefail: the test's exit code survives the pipe (D8)
        shell: bash
        run: pnpm --filter theocode test:live 2>&1 | node scripts/redact-key-shapes.mjs
      # TheoClaw's live tests (apps/theoclaw/tests/live) skip unless THEOCLAW_LIVE=1, and no job set
      # it, so they skipped green on every push (S-004 loop-test-audit, TP-D2-skipped). Here they run
      # with the flag, the model and the key, so a missing one fails by name. One file at a time:
      # several of them start an sshd or an instance process and share the host's ports.
      # The script builds `theoclaw...`, TheoClaw and its workspace dependencies: control-plane and
      # instance-profiles spawn apps/theoclaw/dist/main.js, which `theoclaw^...` never built (B-651),
      # and the script fails naming that file when it is missing. It also runs TheoClaw's build:web,
      # because webchat.live.test.ts needs the page bundle (GET /webchat is 503 without it). ci.yml's
      # `live-model-build` job runs the same script on every pull request (B-659).
      - name: Build TheoClaw and its workspace dependencies
        run: node scripts/live-model-build.mjs theoclaw
      - name: TheoClaw live tests (THEOCLAW_LIVE)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THEOCLAW_LIVE: '1'
          THEOCLAW_HOST_TOOLS: 'on'
          THEOCLAW_MODEL: ${{ env.LIVE_MODEL }}
        # bash -eo pipefail: the suite's exit code survives the pipe (D8)
        shell: bash
        run: pnpm --filter theoclaw test:live 2>&1 | node scripts/redact-key-shapes.mjs
