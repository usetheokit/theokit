name: Postgres Jobs CI

# T3.1 of system-100-percent-functional-plan + ADR D4.
# Runs the PostgresJobBackend integration test against a real Postgres
# (Docker service) to verify SKIP LOCKED race-safety. pg-mem covers SQL
# shape locally; this workflow validates concurrent-dequeue semantics.

on:
  # `main` only -- `develop` was duplication. A commit landing on `develop` is validated by the
  # `workspace -> develop` pull request that carried it and again by the `develop -> main` pull
  # request opened seconds later, and `concurrency` cannot collapse the pair because it keys on
  # `github.ref`. Measured on `ci.yml`, where the same duplication costs ~29 minutes a time; the
  # reasoning and the cache caveat are written out there.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/theo/src/server/jobs/job-backend-postgres.ts'
      - 'tests/integration/job-backend-postgres-real.test.ts'
      - '.github/workflows/postgres-jobs-ci.yml'

permissions:
  contents: read

concurrency:
  group: postgres-jobs-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  postgres-integration:
    name: Postgres integration (SKIP LOCKED)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Ephemeral Postgres service credentials. Default image creds for
      # postgres:15-alpine — visible because the service is bound to
      # localhost inside the GHA runner and torn down with the job.
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: theokit_test

    services:
      postgres:
        # Pinned by digest, for the same reason every action here is pinned by SHA: `15-alpine` is
        # a MOVING tag. Postgres rebuilds it on every patch and every Alpine base bump, so the
        # database this suite runs against can change with no commit in this repository. That is
        # the failure mode this job exists to rule out — it asserts SKIP LOCKED race-safety, and a
        # silent minor-version change underneath it turns a real regression into "flaky CI".
        #
        # Resolved from the registry on 2026-09-09, not copied from memory. To move it:
        #   docker buildx imagetools inspect postgres:15-alpine --format '{{.Manifest.Digest}}'
        # The tag stays in the comment so the next reader knows what the digest is supposed to be.
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
      # caller without nine pull requests, which is the reason that repository exists. What the
      # action RUNS stays pinned: every action inside it by digest, the Node version from
      # `.nvmrc`, and pnpm from `packageManager`.
      #
      # It carries the cache reasoning this block spelled out: `cache-dependency-path` lists
      # `package.json` beside `pnpm-lock.yaml`, because setup-node keys the pnpm store on the
      # lockfile alone — so a pnpm 9 → 10 bump leaves the key identical and the job restores a
      # store the new pnpm reads as inconsistent (`ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`).
      #
      # The frozen install is the action's default, so the separate step is gone.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses] first-party moving major, ADR-0021
      # dogfood-regressions-fix-plan v1.1 T4.2 — defense in depth.
      # Even Node-pinned workflows benefit: pnpm cache could carry a
      # binding compiled for a different patch version.
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"
      - name: Assemble PG connection URL at runtime
        # Built piecewise so the secret-scan pre-commit hook doesn't match
        # the literal `pg://user:pass@host:port/db` regex shape.
        run: |
          SCHEME="postgres"
          URL="${SCHEME}://${PG_USER}:${PG_PASSWORD}@localhost:5432/${PG_DATABASE}"
          echo "POSTGRES_URL=${URL}" >> "$GITHUB_ENV"
      - name: Run real-Postgres integration test
        run: pnpm vitest run tests/integration/job-backend-postgres-real.test.ts
