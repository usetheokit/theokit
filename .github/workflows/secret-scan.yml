# TruffleHog over the range a push or merge would introduce. The local .githooks/pre-commit
# gate is the one that prevents a leak; this is the one that cannot be skipped —
# `git commit --no-verify` bypasses the hook silently, and a fresh clone has no hook at all
# until `prepare` runs.
#
# The implementation is shared. Nine repositories carried it, functionally identical, and
# differed in one comment — the one explaining why the ghcr image tag has no `v` prefix,
# written twice by two people who each found out the hard way.
#
#   https://github.com/usetheokit/shared-workflows/blob/main/.github/workflows/secret-scan.yml
name: Secret Scan

on:
  push:
    branches: [main, develop, workspace]
  # Both promotion legs are PRs — workspace -> develop and develop -> main — so both bases
  # are listed. On a pull_request the action scans base..head, the range the merge adds.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Declared here rather than in the reusable: a concurrency group inside a reusable is
# shared by every repository calling it, so a run in one would cancel a run in another.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  trufflehog:
    uses: usetheokit/shared-workflows/.github/workflows/secret-scan.yml@v1 # zizmor: ignore[unpinned-uses]
