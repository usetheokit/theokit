name: Secret Scan

# The local .githooks/pre-commit gate is the one that prevents a leak; this workflow is
# the one that cannot be skipped. `git commit --no-verify` bypasses the hook silently
# and a fresh clone has no hook at all until `prepare` runs, so the push has to be
# checked again somewhere the author does not control.

on:
  push:
    branches: [main, develop, workspace]
  # Both promotion legs are PRs — workspace -> develop and develop -> main — so both
  # bases are listed. On a pull_request the action scans base..head, which is the range
  # the merge would introduce.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    # The scan is a diff range, normally seconds. A ceiling well under GitHub's 6-hour
    # default keeps a wedged container from holding the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action resolves the base and head commits with `git rev-parse`, so the
          # shallow clone Actions makes by default would leave it unable to see the
          # range and it would scan nothing while still reporting success.
          fetch-depth: 0
          # Nothing here pushes. Leaving the token in .git/config would let any later
          # step, or any tool reading the config, act as this repository.
          persist-credentials: false

      - name: Scan for leaked credentials
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          # The action SHA pins the wrapper, not the scanner: internally it runs
          # `docker run ghcr.io/trufflesecurity/trufflehog:${version}` and that input
          # defaults to `latest` — a mutable tag, re-resolved on every run. Pinning the
          # SHA while leaving the version floating would pin the part that does not
          # execute the scan. Bump both together.
          #
          # No `v` prefix. This value is interpolated straight into the image reference,
          # so it has to be the ghcr TAG, which is `3.97.0` — the git tag is `v3.97.0`
          # and only that one carries the prefix. `v3.97.0` returns 404 from the registry
          # and the step dies with `manifest unknown`, exit 125. That is fail-closed, so
          # it blocked rather than passing silently, but it blocks every push until the
          # tag is right.
          version: 3.97.0
          # All three detection classes fail the job, and the distinction between them is
          # not the intuitive one:
          #
          #   verified   — authenticated against the provider; the credential is live.
          #   unknown    — verification could not COMPLETE: provider unreachable, throttled.
          #   unverified — DETECTED but not confirmed live: provider said invalid, or the
          #                detector has no verifier at all.
          #
          # Omitting `unverified` was measured to be a hole, not a theory: a `ghp_…` GitHub
          # token scanned under `--results=verified,unknown` produced zero findings and a
          # green run. A gate that only stops credentials it can prove are live misses every
          # revoked, rotated, typo'd or not-yet-activated one — and a secret written into the
          # history is the leak, whether or not it authenticates today.
          #
          # Confirmed false positives are silenced per line with a `trufflehog:ignore`
          # comment, which shows up in the diff and gets reviewed. Excluding paths would
          # hide any real secret later added to that same fixture.
          #
          # `--exclude-detectors=postgres` is TEMPORARY and must be removed. It exists for exactly
          # one finding, which no narrower mechanism can reach:
          #
          #   postgres://<user>:<pass>@<host>:5432   in the MESSAGE of commit bbdfc15d6
          #
          # (written with angle brackets HERE so this comment is not itself a finding; the
          #  commit carries the bare words `user`, `pass` and `host`.)
          #
          # The credentials there are the literal words `user` and `pass`, and the host is the
          # literal word `host` — TruffleHog's own verification says so: `lookup host … server
          # misbehaving`. The sentence containing it narrates this very class of mistake, which is
          # how it got written down.
          #
          # `trufflehog:ignore` — the mechanism documented above — silences a finding per line of a
          # FILE. This finding has no file: it is commit metadata, and a commit message cannot be
          # edited without rewriting history, which is forbidden on this branch. The alternatives
          # were measured, not assumed: `--filter-entropy` does not drop it at any threshold a real
          # credential would survive (0 / 2.0 / 2.5 / 3.0 / 3.5), the `--config` schema has no
          # allowlist field (protobuf rejects it), and dropping `unverified` would hide every real
          # internal-DB URL, which is unverifiable from a runner by construction.
          #
          # It is transient by construction: `bbdfc15d6` leaves the scan range the moment it is an
          # ancestor of the base branch. Two more runs — this PR and the release PR — and the reason
          # is gone. `tests/unit/secret-scan-postgres-exclusion.test.ts` FAILS once that holds, so
          # the exclusion cannot outlive it, and a second test in that file keeps file-level
          # Postgres coverage in place meanwhile.
          extra_args: --results=verified,unknown,unverified --exclude-detectors=postgres
