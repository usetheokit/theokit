name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quality gates — every job runs on every PR. Failing job blocks merge.
# See CLAUDE.md "Quality Gates" for the rationale per gate.

# tsup DTS build for theokit's ~24 entrypoints OOMs the runner's default worker
# heap (ERR_WORKER_OUT_OF_MEMORY). Raise it workflow-wide.
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  lint-and-format:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The type-aware ESLint rules resolve `@theokit/agents` through its package
      # `types` field, which points at `dist/`. On a fresh checkout that directory
      # does not exist, every type crossing the package boundary resolves to an
      # `error` type, and the rules report it as `acts as 'any'` — a red job whose
      # message points at application code that is not wrong.
      #
      # It passed locally because `dist/` was left over from an earlier build, so
      # the local lint gate had been giving false assurance for as long as this job
      # had been red. Proven by removing `packages/agents/dist` locally: the exact
      # CI errors appear, and restoring it returns exit 0.
      - run: pnpm --filter "./packages/*" build
      - name: ESLint (strict — zero warnings)
        run: pnpm lint
      - name: Prettier (format check)
        run: pnpm format:check

  typecheck-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # Sibling theokit-sdk is declared as a workspace member in
      # pnpm-workspace.yaml (`../theokit-sdk/packages/{sdk,gateway,gateway-telegram}`).
      # pnpm-lock.yaml lists those packages with `link:` paths — pnpm install
      # expects the files on disk. `dist/` isn't committed so we also build
      # the SDK before consuming it (typecheck needs the type entries to
      # resolve at `./dist/index.d.ts`). Public repo, anonymous clone OK.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheodev/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      # Build BEFORE typecheck: tests/smoke/import-validation.test.ts
      # imports from `packages/theo/dist/*` to validate the npm publish
      # surface — those files don't exist until build runs.
      # Filter to packages/* only: `pnpm -r build` would walk examples
      # too, which call `theokit build` (needs the bin from packages/theo,
      # but the binstub points to dist/cli/index.js which doesn't exist
      # until the theo package finishes building → ordering blow-up).
      - run: pnpm --filter "./packages/*" build
      - run: pnpm typecheck

  test:
    name: Unit + Type tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 was dropped (backlog B-M67-19).
        #
        # Every manifest here declares `engines.node: ">=22.12.0"`, and the CLI does not merely warn —
        # it REFUSES: `[theokit preflight] theokit requires node >= 22.12.0 (you are running
        # v20.20.2)`. So the Node-20 leg was exercising a configuration the product explicitly does
        # not support, and every test that shells out to the CLI failed there by design.
        #
        # It surfaced only now because those tests used to die earlier, on `pnpm exec theokit` not
        # resolving the bin at all (B-M67-17). Fixing the resolution let the CLI actually run, and the
        # next layer — the engine floor — became visible. A red leg that can never be green is the
        # shape this cycle spent its time removing.
        #
        # Restoring a second version means first deciding to support it: lower the floor in `engines`,
        # or the leg is theatre.
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      # Sibling theokit-sdk: workspace member declared in pnpm-workspace.yaml.
      # `dist/` isn't committed → build after clone so type entries resolve.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheodev/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      # dogfood-regressions-fix-plan v1.1 T4.2 — defense in depth against
      # NODE_MODULE_VERSION mismatch. CRITICAL here because the matrix runs
      # both Node 20 and Node 22 against the same pnpm store (cache); the
      # binding installed under one Node version cannot dlopen under the
      # other. Without this step the matrix would silently break.
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"
      # Build packages before running tests so the integration tests that
      # exercise `theokit build` (cron/job manifest tests, scaffold-build-start
      # E2E) find the bin at `packages/theo/dist/cli/index.js`.
      - run: pnpm --filter "./packages/*" build
      # M75 T1.2 — os testes de confinamento de kernel que o agent-builder migra para cá exigem
      # bubblewrap. `apt install` sozinho NÃO basta no ubuntu-latest: o Ubuntu 24.04 bloqueia user
      # namespaces não-privilegiados via AppArmor, e a detecção ativa (`bwrap --unshare-user ...`)
      # falha com "user namespaces unavailable (container/kernel restriction)". Medido no
      # agent-builder run 30179607376: o binário instalou e 10 testes CONTINUARAM pulando; só depois
      # do sysctl (run 30179704525) foram a 856 passed | 0 skipped.
      #
      # O smoke ao final falha o passo se o userns seguir bloqueado — sem ele, um teste de
      # confinamento que pula é reportado verde, e o gate certificaria por ausência de execução.
      - name: Install bubblewrap + enable unprivileged userns (kernel-confinement tests)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true && echo "bwrap OK: userns liberado"
      - run: pnpm test
      - run: pnpm test:types

  coverage:
    name: Coverage gate (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # Sibling theokit-sdk: workspace member declared in pnpm-workspace.yaml.
      # `dist/` isn't committed → build after clone so type entries resolve.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheodev/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"
      # Build packages before tests — same rationale as `test` job above.
      - run: pnpm --filter "./packages/*" build
      - name: Run tests with coverage thresholds
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # The `e2e` (Playwright) job lived here and was REMOVED along with `fixtures/`.
  #
  # The whole e2e harness was built out of fixtures: `playwright.config.ts` derived one webServer
  # per fixture (`fixtures/wave1-hello-theo`, `fixtures/app-router-*`) and the specs under
  # `tests/e2e/` drove those servers. With the fixtures gone there is nothing left to boot, so the
  # config, the specs and this job went together.
  #
  # What was actually lost: there is NO browser coverage left. The file-system router, the
  # scaffolded page's hydration, the CSP nonce and the WebSocket echo were exercised end to end
  # only here.

  dead-code:
    name: Dead code (Knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # Sibling theokit-sdk: workspace member declared in pnpm-workspace.yaml.
      # `dist/` isn't committed → build after clone so type entries resolve.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheodev/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      # Build packages first so knip can resolve theokit's dist exports.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm knip

  # The `dependency-audit` job lived here and was REMOVED along with `scripts/audit-scopes.mjs`,
  # which was everything it ran (`pnpm check:audit`). No replacement: no gate in this repository
  # looks at dependency advisories any more. Read the comment below with that in mind — it claims
  # `dependency-review` could go because this job covered `fail-on-severity: high`. It no longer does.

  # The `dependency-review` job lived here and was REMOVED (backlog B-M67-15).
  #
  # `actions/dependency-review-action` needs GitHub's dependency graph, which on a PRIVATE repository
  # requires an Advanced Security licence. This repo is private with `security_and_analysis: null`, so
  # every run ended with "Dependency review is not supported on this repository" — a gate that could
  # not pass, by construction, no matter what the diff contained.
  #
  # Removing it costs nothing, because BOTH of its checks already have working equivalents here:
  #
  #   * `fail-on-severity: high`  ->  the `Dependency audit (npm audit, high+)` job (`pnpm check:audit`)
  #   * `allow-licenses: …`       ->  the `License compliance` job (`scripts/check-licenses.mjs`),
  #                                   whose allowlist is a superset of the list this job declared
  #
  # Licensing GHAS is a real option and would bring back the transitive-diff view neither of the two
  # replacements has. That is a purchasing decision, not a CI one — and until it is made, an
  # impossible gate is worse than no gate: it teaches the team to read red as noise.

  # The `license-check` job lived here and was REMOVED along with `scripts/check-licenses.mjs`.
  # There is no dependency licence check in CI any more — the allowlist it enforced (cited by the
  # `dependency-review` comment above as equivalent coverage) went with the script.

  # The `bundle-budget` job lived here and was REMOVED: it ran `scripts/check-bundle-budget.sh`
  # against a build of `fixtures/template-default`, and both sides — script and fixture — are gone.
  # The 350 KB gzipped ceiling on the client bundle is no longer measured by anything.

  # O job `e2e-postgres-templates` vivia aqui e foi REMOVIDO (backlog B-M67-12).
  #
  # Ele provisionava um Postgres, empurrava dois schemas e rodava specs Playwright para as fixtures
  # `template-postgres` e `template-saas`. O ADR 0023 (2026-06-17, default-only template set) removeu
  # esses templates de propósito — e o job sobreviveu a eles. TODOS os artefatos que ele citava já não
  # existiam: as duas fixtures, o `playwright.postgres-templates.config.ts` e o plano em `docs/plans/`.
  #
  # Ou seja: um gate IMPOSSÍVEL de passar por construção, vermelho a cada run, gastando um serviço de
  # banco para testar algo que o time decidiu não ter. Um gate assim é pior que gate nenhum — ele
  # ensina o time a ignorar vermelho, e foi exatamente esse hábito que deixou dois releases seguidos
  # merjarem com 12 checks vermelhos (#210).

  # The `secret-scan` job lived here and was REMOVED along with `scripts/prevent-secrets.sh`.
  # Together with the same script leaving the `pre-commit` hook, NO secret scanning is left in this
  # repository — neither local nor in CI. A committed secret now depends on human review or the
  # provider's scanner to be noticed.

  package-validation:
    name: Package validation (publint + ATTW + smoke)
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck-build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm validate:publint
      - run: pnpm validate:attw
      # The `check-pack-no-workspace` step went away with `scripts/check-pack-no-workspace.mjs`. It
      # was the theokit#153 guard: `theokit` 0.19.0-0.30.0 published raw `workspace:^` and every
      # `npm install` of those twelve versions still fails — a published version can only be
      # deprecated, never corrected. Packing each package and inspecting the TARBALL was what caught
      # the leak while it was still cheap. That leak is possible again, undetected.
      - run: npx vitest run tests/smoke/
