name: CI

on:
  # `main` only. `develop` was here and was pure duplication, measured rather than reasoned: of the
  # last 40 CI runs, SIX commits ran this workflow twice on the identical head SHA -- once from the
  # push that merged `workspace -> develop`, once from the `develop -> main` promotion pull request
  # opened seconds later. Four of the six pairs started within 33 seconds of each other, and each
  # run bills ~29 minutes.
  #
  # `concurrency` cannot collapse them: it is keyed on `github.ref`, which is `refs/heads/develop`
  # for the push and `refs/pull/N/merge` for the pull request, so the two land in different groups
  # by construction.
  #
  # WHAT THIS COSTS, corrected after the fact rather than left as first written. The claim here
  # was "dropping the push loses no verdict", measured over 100 runs which contained zero
  # counter-examples. Re-measured over 1000 runs across seven days, `develop` took 17 pushes and
  # FIVE of them had no pull-request run on the same SHA -- all five the merge commit of a
  # `workspace -> develop` promotion. So a verdict IS lost, on that commit, and the first
  # measurement was too small to see it.
  #
  # What survives the correction is why the loss is narrow. A `pull_request` run tests
  # `refs/pull/N/merge` -- head already merged into base -- so the TREE a merge commit carries was
  # validated before the merge; tree `007672610` was measured identical across the workspace pull
  # request, this push, the promotion pull request and the main push. What goes unverified is the
  # merge commit as its own object, and only until the next pull request in or out of `develop`
  # re-validates the branch. Nothing deploys from `develop`; releases cut from `main`, behind the
  # promotion pull request that does run these checks.
  #
  # The residual case is a stale pull request merging into a moved `develop` -- branch protection
  # here sets `strict: false`, so the merge result need not be the combination that was tested.
  # `strict: true` would close it, at the cost of forcing an update before every merge. That
  # trade is not made here; it is named so the next reader can make it deliberately.
  #
  # A direct push to `develop` -- the other path that would slip through -- is forbidden by
  # `rules/git-safety.md` and blocked by `validate-command.sh`.
  #
  # `main` stays: SonarQube measures new code against its analysis of the default branch, and that
  # baseline comes from these runs.
  #
  # THE COST, stated rather than discovered: Actions caches are scoped per branch, and pull requests
  # read the base branch's cache. `develop` no longer writes one, so a `workspace -> develop` pull
  # request may restore a colder pnpm store. Setup measured 30s of a 409s job with the cache warm;
  # the ceiling on this regression is that step, against ~29 minutes saved per promotion.
  push:
    branches: [main]
  pull_request:
    # Both promotion legs are pull requests — workspace -> develop and develop -> main — so
    # both bases belong here. Until 2026-08-19 only `main` was listed, so the nine quality
    # jobs below never ran on the first leg: a PR into `develop` reported no check at all.
    # That is also why `develop` could not be protected — requiring a context no workflow
    # emits blocks every PR forever, so the branch was left with an empty required list,
    # which reads as protection and demands nothing.
    branches: [main, develop]
  # Manual dispatch against any ref. Added so this workflow can be exercised without opening a
  # pull request — which is how the shape of a matrix job's NAME gets verified, and the name is
  # what branch protection requires. `Unit + Type tests (22.12)` is a required context; if adding
  # a key to that matrix leg renamed the job, the required check would stop existing and every
  # pull request would wait for it forever, with no error anywhere.
  workflow_dispatch:

# Quality gates — every job runs on every PR. A failing job blocks merge.

# tsup DTS build for theokit's ~24 entrypoints OOMs the runner's default worker
# heap (ERR_WORKER_OUT_OF_MEMORY). Raise it workflow-wide.
env:
  NODE_OPTIONS: --max-old-space-size=8192

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  lint-and-format:
    name: Lint + Format
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: package-dist
          path: packages
      # The type-aware ESLint rules resolve `@theokit/agents` through its package
      # `types` field, which points at `dist/`. On a fresh checkout that directory
      # does not exist, every type crossing the package boundary resolves to an
      # `error` type, and the rules report it as `acts as 'any'` — a red job whose
      # message points at application code that is not wrong.
      #
      # It passed locally because `dist/` was left over from an earlier build, so
      # the local lint gate had been giving false assurance for as long as this job
      # had been red. Proven by removing `packages/agents/dist` locally: the exact
      # CI errors appear, and restoring it returns exit 0.
      - name: ESLint (strict — zero warnings)
        run: pnpm lint
      - name: Prettier (format check)
        run: pnpm format:check
      # The published-manifest contract, checked instead of remembered. Audited across 50
      # packages on 2026-09-01: 38 did not export "./package.json" — reproduced as
      # `ERR_PACKAGE_PATH_NOT_EXPORTED` against a real tarball — 30 had no keywords and 18
      # declared no sideEffects at all.
      #
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
      # caller without nine pull requests, which is the reason that repo exists.
      - name: Published manifests satisfy the contract
        uses: usetheokit/shared-workflows/actions/manifest-check@v1 # zizmor: ignore[unpinned-uses]

  typecheck-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      # Build BEFORE typecheck: tests/smoke/import-validation.test.ts
      # imports from `packages/theo/dist/*` to validate the npm publish
      # surface — those files don't exist until build runs.
      # Filter to packages/* only: `pnpm -r build` would walk examples
      # too, which call `theokit build` (needs the bin from packages/theo,
      # but the binstub points to dist/cli/index.js which doesn't exist
      # until the theo package finishes building → ordering blow-up).
      - run: pnpm build:packages
      # `typecheck:only`, not `typecheck`: the latter is `pnpm build:packages && tsc --noEmit`,
      # and the step above already built. Measured on run 33179795266 — build:packages 51s, then
      # typecheck 67s, of which ~50s was that build running a second time.
      - run: pnpm typecheck:only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: packages/*/dist
          retention-days: 1

  test:
    name: Unit + Type tests
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Node 20 was dropped (backlog B-M67-19).
        #
        # Every manifest here declares `engines.node: ">=22.12.0"`, and the CLI does not merely warn —
        # it REFUSES: `[theokit preflight] theokit requires node >= 22.12.0 (you are running
        # v20.20.2)`. So the Node-20 leg was exercising a configuration the product explicitly does
        # not support, and every test that shells out to the CLI failed there by design.
        #
        # It surfaced only now because those tests used to die earlier, on `pnpm exec theokit` not
        # resolving the bin at all (B-M67-17). Fixing the resolution let the CLI actually run, and the
        # next layer — the engine floor — became visible. A red leg that can never be green is the
        # shape this cycle spent its time removing.
        #
        # Restoring a second version means first deciding to support it: lower the floor in `engines`,
        # or the leg is theatre.
        node-version: ['22.12', '22']
        # `include` adds a key to an EXISTING leg; a second matrix dimension would double the
        # legs instead of annotating one. The floor version carries it, because that is the
        # configuration `engines` promises — so the percentage describes what consumers run.
        include:
          - node-version: '22.12'
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: package-dist
          path: packages
      # dogfood-regressions-fix-plan v1.1 T4.2 — defense in depth against
      # NODE_MODULE_VERSION mismatch. CRITICAL here because the matrix runs
      # both Node 20 and Node 22 against the same pnpm store (cache); the
      # binding installed under one Node version cannot dlopen under the
      # other. Without this step the matrix would silently break.
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"
      # Build packages before running tests so the integration tests that
      # exercise `theokit build` (cron/job manifest tests, scaffold-build-start
      # E2E) find the bin at `packages/theo/dist/cli/index.js`.
      # M75 T1.2 — the kernel-confinement tests need bubblewrap. `apt install` alone is NOT enough
      # on ubuntu-latest: Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and the
      # active probe (`bwrap --unshare-user ...`) fails with "user namespaces unavailable
      # (container/kernel restriction)". Measured: the binary installed and 10 tests KEPT skipping;
      # only after the sysctl did they reach 856 passed | 0 skipped.
      #
      # The smoke check at the end fails the step if userns is still blocked — without it a skipped
      # confinement test reports green, and the gate would certify by absence of execution.
      - name: Install bubblewrap + enable unprivileged userns (kernel-confinement tests)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true && echo "bwrap OK: userns liberado"
      # Coverage is a FLAG on this run, not a second run of it. It used to be a separate job
      # that checked out, installed, cloned and built the sibling SDK, rebuilt the native
      # binding, built the packages and then ran `vitest run --coverage` — the same suite this
      # matrix had already run twice. Measured at 8.8 minutes per run, on ~100 runs a week.
      #
      # It also measured the wrong suite. That job never installed bubblewrap and never lifted
      # the AppArmor userns restriction, so the ten kernel-confinement tests SKIPPED there while
      # passing here: the percentage described an execution the product does not have.
      #
      # One leg carries the flag rather than both. The numbers would be identical, and two legs
      # uploading under one artifact name is an upload conflict.
      # `hanging-process` on the coverage leg (#635). It prints NOTHING on a healthy run and lists the
      # handles keeping the process alive when the run will not terminate — which is the one thing
      # four dead 30-minute jobs could not tell anyone. Those jobs died at the workflow's own ceiling
      # having printed only successes: the summary comes last, so a run that never finishes has no
      # failure in its log at all, and the author bisects a commit instead of reading a name.
      #
      # On the coverage leg alone, because that is the leg it happens on, and because a second
      # reporter on the leg that already passes buys nothing.
      - name: Tests${{ matrix.coverage && ' + coverage thresholds' || '' }}
        # zizmor: ignore[template-injection] — `matrix.coverage` is a boolean this workflow sets in
        # its own `strategy.matrix`, a few lines up. It is not reachable by anyone opening a pull
        # request, so the expression selects between two literals written here and cannot carry an
        # attacker-supplied string into the shell. Passing it through `env:` would not make it
        # safer; it would only move a constant.
        run: ${{ matrix.coverage && 'pnpm test:coverage --reporter=default --reporter=hanging-process' || 'pnpm test' }}
      # Once, not once per leg. `vitest --typecheck.only` runs TypeScript over the `.test-d.ts`
      # files, and its diagnostics come from the TS version, the tsconfig and the sources — all
      # pinned by the lockfile, none varying with the node runtime that executes tsc. The second
      # run recomputed a result guaranteed to be identical. Measured at 283s and 316s on the two
      # legs of one run.
      #
      # The same argument the coverage comment above makes, and the same waste it removed; it
      # simply had not been applied here.
      #
      # WHICH leg matters, and the obvious answer is wrong. Putting it beside coverage on the
      # floor leg saves nothing, because that leg is already the critical path. Measured on run
      # 33179795266: today max(743s, 876s) = 14.6 min; beside coverage max(460s, 876s) = 14.6 min;
      # here max(743s, 560s) = 12.4 min. The lighter leg is what balances them.
      #
      # `!matrix.coverage` rather than a new matrix key on purpose: coverage is already confined to
      # exactly one leg, and that confinement is ENFORCED — two legs uploading under one artifact
      # name is an upload conflict, which fails loudly. Borrowing an invariant something already
      # checks means this condition cannot silently select no leg. A new key would be one nobody
      # verifies, and a type gate that quietly stops running is the failure this repo keeps paying
      # for. Both legs remain required contexts, so the check keeps blocking either way.
      - name: Upload coverage report
        if: ${{ matrix.coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Type-level tests, split out of `test`.
  #
  # They ran as a second step inside the node-22 leg, in series after the unit suite: that leg
  # took 12.5 minutes against 7.5 for the leg that skipped them, and it was the critical path for
  # the whole workflow. `vitest --typecheck.only` shares nothing with the unit run but the build,
  # so running it beside them costs one more runner and removes five minutes from the chain.
  type-tests:
    name: Type tests
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          node-version: '22'
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: package-dist
          path: packages
      # dogfood-regressions-fix-plan v1.1 T4.2 — defense in depth against
      # NODE_MODULE_VERSION mismatch. CRITICAL here because the matrix runs
      # both Node 20 and Node 22 against the same pnpm store (cache); the
      # binding installed under one Node version cannot dlopen under the
      # other. Without this step the matrix would silently break.
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"
      # Build packages before running tests so the integration tests that
      # exercise `theokit build` (cron/job manifest tests, scaffold-build-start
      # E2E) find the bin at `packages/theo/dist/cli/index.js`.
      - run: pnpm test:types

  scaffold-typecheck:
    # usetheokit/theokit#396 — a freshly scaffolded app must pass its own `typecheck` script.
    #
    # This gate exists because the same defect shipped twice: #80 in `app/page.tsx`, then #396 in
    # `app/hooks/use-transcript.ts`. Both were the template naming a type from a package the
    # repository does not install, so no test here could see it — the only thing that catches it is
    # scaffolding the template and running `tsc` against the packages a real user gets.
    #
    # Verified locally before it was written: the recipe below is the one that reaches
    # `tsc --noEmit` exit 0 on a clean tree. `pnpm try:scaffold` is deliberately NOT used — it omits
    # `--yes` and prompts, so it fails under CI with no TTY.
    name: Scaffolded app typechecks
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: package-dist
          path: packages
      # The scaffold links against this working tree, so the packages must be built first —
      # otherwise `tsc` reads a stale `dist` and reports errors that belong to neither the template
      # nor the source. That exact confusion cost a debugging pass while this job was being written.
      # `--skip-install` because the CLI's own install runs BEFORE the link step below and resolves
      # the template's pins from npm. After `changeset version` bumps `theokit` to the version the
      # release is about to publish, that install cannot succeed — which deadlocked the release,
      # since this is a required check and publishing needs the merge it blocks (#438). The root
      # install two steps down is what actually links `my-test`, so the CLI's was always redundant
      # here; it was only ever passing because the previous pin happened to resolve, which meant
      # this job measured the PUBLISHED package rather than this tree — the defect #420 reports.
      - name: Scaffold the default template
        run: node_modules/.bin/tsx packages/create-theokit/src/cli.ts my-test --yes --use-pnpm --disable-git --skip-install
      - name: Point it at this working tree, not at npm (#420)
        run: node_modules/.bin/tsx scripts/link-scaffold-to-workspace.ts my-test
      # `my-test` is a declared workspace member, so the ROOT install is what links it and pulls the
      # app's own dependencies — `@theokit/ui` among them, which is the package the template names
      # and this repository otherwise never installs.
      - run: pnpm install --no-frozen-lockfile
      - name: tsc --noEmit on the untouched scaffold
        run: cd my-test && ../node_modules/.bin/tsc --noEmit
      # #467 — the same check against `--preset=bot`, and it is the load-bearing one for that
      # preset. Two real defects survived every local gate and died here: `SandboxProvider` typed as
      # `{ mode }` (it is a backend, or a function returning one) and `defineCron` imported from
      # `theokit/server/define` (it lives in `theokit/server/cron`). Neither is visible from
      # `create-theokit`, whose tests can only see that files were copied.
      #
      # `my-test-bot` is its own workspace member, declared alongside `my-test` in
      # `pnpm-workspace.yaml`: the root install links only declared members, so a scaffold outside
      # the list resolves the template's pins from npm and this check would measure the PUBLISHED
      # package instead of this tree — the defect #420 reports.
      - name: Scaffold with --preset=bot, over the same app
        run: node_modules/.bin/tsx packages/create-theokit/src/cli.ts my-test-bot --preset=bot --yes --use-pnpm --disable-git --skip-install
      - name: Point the bot scaffold at this working tree too
        run: node_modules/.bin/tsx scripts/link-scaffold-to-workspace.ts my-test-bot
      - run: pnpm install --no-frozen-lockfile
      - name: tsc --noEmit on the bot preset
        run: cd my-test-bot && ../node_modules/.bin/tsc --noEmit

  dead-code:
    name: Dead code (Knip)
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: package-dist
          path: packages
      # Build packages first so knip can resolve theokit's dist exports.
      - run: pnpm knip

  package-validation:
    name: Package validation (publint + ATTW + smoke)
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOT waiting on `test`, deliberately. This job installs, builds and runs its own smoke
    # suite; it consumes no artifact and no output from lint, typecheck or test. The dependency
    # was ordering, and it cost the wall clock: measured on a real run, `test` occupied +0.1 to
    # +12.5 and this job +12.6 to +14.3 — a twelve-minute wait in front of a 1.7-minute job for
    # nothing it needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: package-dist
          path: packages
      - run: pnpm validate:publint
      - run: pnpm validate:attw
      - run: npx vitest run tests/smoke/
      # The two tarball gates, moved here from release-only on 2026-09-16.
      #
      # They ran ONLY in `release.yml`, which is why a release died at them instead of a PR: the
      # entry-point gate runs BEFORE the publish step, and `theokit`'s `@theokit/agents:
      # workspace:^` packs to the version being released — which the registry does not have, by
      # construction. Every release bumping a package the meta-package depends on failed there, and
      # the first signal was a dead release rather than a red check.
      #
      # This job is where they belong and nothing had to be added for them: it already downloads
      # `package-dist` into `packages/`, which is the one precondition packing has. Measured on the
      # release run that failed: 44s over 60 entry points.
      - run: node scripts/check-pack-exports-resolve.mjs
      - run: node scripts/check-pack-entry-points-load.mjs

  # Supply chain. Both jobs were deleted in a cleanup pass and left no replacement — an advisory in
  # a transitive dependency, or a copyleft package entering a tree that publishes to npm, was caught
  # by nothing. Neither reimplements a tool: audit is pnpm's own, and the licence gate reads pnpm's
  # report and applies a policy that lives in the repository.
  # `apps/theocode` — the first-party application that consumes this framework, brought in on
  # 2026-09-16. Its six CI jobs came with the subtree as inert files under `apps/theocode/.github/`,
  # which GitHub never reads: workflows are only honoured at the repository root. They are folded
  # into this one job, whose steps carry the same names so a failure stays attributable.
  #
  # ONE job and not six, because every one of them was `pnpm run <script>` in the same directory:
  # the definitions stay in `apps/theocode/package.json`, which is where that product owns them.
  #
  # `needs: typecheck-build` and the artifact download are not ceremony. `@theokit/agents` resolves
  # through its own `exports` map to `dist/`, so these tests import the BUILT framework — the same
  # precondition `package-validation` has, and the reason this job sits beside it rather than in the
  # `test` job, which has no dist.
  #
  # Its suite is NOT merged into the root vitest `projects` list, deliberately. Vitest reads
  # `coverage` from the root config only, so aggregating would silently discard the 62.03% floor
  # `apps/theocode/vitest.config.ts` documents across 170 lines — a measured number becoming inert
  # is the accepted-and-ignored failure this repository keeps finding.
  theocode:
    name: TheoCode (the consumer that validates this framework)
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: package-dist
          path: packages
      # The language gate needs a dictionary, and the runner does not ship the Portuguese half.
      #
      # Brought over verbatim from `apps/theocode`'s own workflow, whose six jobs became inert
      # files under `apps/theocode/.github/` when the subtree moved in on 2026-09-16. I rebuilt
      # the job from its package scripts and did not rebuild this, so `pnpm --filter theocode
      # test` went red on four `check-english-only` assertions that read `expected [] to include
      # 'desligado'` — the detector finding NOTHING, which is what a missing lexicon looks like
      # from inside a unit test.
      #
      # Restored rather than rewritten. Both steps carry measurements this session did not make:
      # the retry exists because a mirror stalled silently three runs in a row, and the floor
      # check exists because "the package installed" and "the lexicon loaded" once disagreed by a
      # quarter of the English vocabulary while the install step reported success.
      - name: Provide word lists (skip apt when the image already has them)
        run: |
          set -u
          # B-073 — ASK BEFORE INSTALLING. `check-english-only.mjs` accepts any of these paths, and
          # the runner image may already carry one; three consecutive runs on 2026-08-19 exhausted
          # every apt retry against a mirror that stalls with zero output, so an install we do not
          # need is an outage we do not need to survive. This also prints what IS present, which is
          # the measurement the workflow never made.
          echo "--- dictionaries present before any install:"
          ls -1 /usr/share/dict/ 2>/dev/null || echo "  (no /usr/share/dict)"
          ls -1 /usr/share/hunspell/ 2>/dev/null || echo "  (no /usr/share/hunspell)"

          have_en=0; have_pt=0
          for f in /usr/share/dict/american-english /usr/share/dict/words /usr/share/hunspell/en_US.dic; do
            [ -s "$f" ] && have_en=1
          done
          for f in /usr/share/dict/brazilian /usr/share/dict/portuguese /usr/share/hunspell/pt_BR.dic; do
            [ -s "$f" ] && have_pt=1
          done
          if [ "$have_en" = 1 ] && [ "$have_pt" = 1 ]; then
            echo "both dictionaries already present — apt not needed"
            exit 0
          fi
          # B-073 bullet 3 — BOTH packages, always, and the reason is a mistake worth keeping.
          #
          # This step briefly installed only what `have_en`/`have_pt` reported missing. On
          # `ubuntu-24.04` that meant `wbrazilian` alone, because `/usr/share/hunspell/en_US.dic`
          # ships with the image and `LEXICONS.en` lists that path. The install SUCCEEDED —
          # "missing (en=1 pt=0) — installing: wbrazilian", "word lists installed on attempt 1" —
          # and five `check-english-only` tests went RED that had been green on the parent commit.
          #
          # THE MEASUREMENT WAS TRUE AND ABOUT THE WRONG PROPERTY. `check-english-only.mjs`
          # ACCEPTS `en_US.dic`, which is what was measured. It does not produce the same LEXICON
          # from it: `loadLexicon` unions every path that exists, so dropping `wamerican` also
          # dropped `/usr/share/dict/american-english` AND `/usr/share/dict/words` (a
          # dictionaries-common symlink that `wamerican` owns) — 102,485 forms down to 75,798.
          # Path acceptance is not lexicon equivalence, and a gate whose verdict is a set
          # difference is decided by exactly that.
          #
          # So: install both. The download saved was real and small; the property it traded away
          # was the gate's correctness, which is not a trade. The `have_*` probe stays because
          # printing what the image carries is worth having on its own.
          # Named literally at the apt call below, not expanded from here: an unquoted `$pkgs`
          # is how this list word-splits into two arguments, and shellcheck reads that as the
          # SC2086 bug it usually is. The variable survives for the operator-facing messages,
          # which is the only job left now that the list is fixed at two.
          pkgs="wamerican wbrazilian"
          echo "missing (en=$have_en pt=$have_pt) — installing:$pkgs"

          for attempt in 1 2 3; do
            # `timeout` per ATTEMPT, not per step: the failure is a silent stall with zero output,
            # so a whole-step ceiling can only report the death, never recover from it.
            if timeout 90 sudo apt-get update -qq \
               && timeout 90 sudo apt-get install -y -qq wamerican wbrazilian; then
              echo "word lists installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed or stalled; backing off" >&2
            sleep $((attempt * 15))
          done
          echo "::error::apt could not provide$pkgs after 3 attempts." >&2
          echo "check-english-only.mjs needs a dictionary and fails closed without one, so this" >&2
          echo "job is RED rather than silently skipping the language gate." >&2
          exit 1

      # B-073 — VERIFY THE LEXICON, not the package. Added because the step above once reported
      # "word lists installed on attempt 1" while the gate it feeds had lost a quarter of its
      # English vocabulary, and five tests went red before anyone connected the two.
      #
      # "The package installed" and "the tool can build the lexicon it needs" are different
      # claims, and only the second one is the reason this step exists. Asserting a FLOOR rather
      # than an exact count: the numbers move with distro versions, and a gate that fails on a
      # dictionary getting bigger would be worse than no gate.
      - name: Verify the lexicons actually load
        run: |
          # shellcheck disable=SC2016  # the `${...}` below are JS template literals inside a
          # node program; shell expansion is the thing the single quotes exist to prevent.
          node -e '
            const { readFileSync, existsSync } = require("node:fs")
            const load = (paths) => {
              const words = new Set()
              let files = 0
              for (const p of paths) {
                if (!existsSync(p)) continue
                files++
                for (const line of readFileSync(p, "latin1").split("\n")) {
                  const w = (line.split("/")[0] ?? "").trim().toLowerCase()
                  if (w.length >= 3 && /^[a-z\u00e0-\u00ff]+$/.test(w)) words.add(w)
                }
              }
              return { files, size: words.size }
            }
            const en = load(["/usr/share/dict/american-english", "/usr/share/dict/words", "/usr/share/hunspell/en_US.dic"])
            const pt = load(["/usr/share/dict/brazilian", "/usr/share/dict/portuguese", "/usr/share/hunspell/pt_BR.dic"])
            console.log(`en: ${en.files} file(s), ${en.size} forms`)
            console.log(`pt: ${pt.files} file(s), ${pt.size} forms`)
            const FLOOR_EN = 90000, FLOOR_PT = 150000
            if (en.size < FLOOR_EN || pt.size < FLOOR_PT) {
              console.error(`::error::lexicon too small — en ${en.size} (floor ${FLOOR_EN}), pt ${pt.size} (floor ${FLOOR_PT}).`)
              console.error("The packages may have installed while the vocabulary the gate needs did not.")
              console.error("Measured 2026-08-20 on ubuntu-24.04: en 102485 with wamerican, 75798 without.")
              process.exit(1)
            }
          '
        timeout-minutes: 2

      - name: typecheck
        run: pnpm --filter theocode run typecheck
      - name: test
        run: pnpm --filter theocode test
      - name: lint
        run: pnpm --filter theocode run lint
      - name: depcruise
        run: pnpm --filter theocode run depcruise
      - name: crossval
        run: pnpm --filter theocode run crossval
      - name: build
        run: pnpm --filter theocode run build

  theoclaw:
    name: TheoClaw (the assistant assembled on this framework)
    runs-on: ubuntu-latest
    # 3 and not 10: NFR-001 of this item's brief bounds this job at 180 seconds, and until now
    # nothing in the file enforced it — `timeout-minutes: 10` is 600s, 3.3x the stated
    # requirement, so the bound lived only in a document while the file allowed anything under
    # ten minutes. The number comes from the REQUIREMENT and not from a measurement: this job
    # has never run (the branch has no upstream), so its first run is what tests both the job
    # and the bound. A failure here means one of the two is wrong, which is the fact a 600s
    # ceiling was hiding.
    timeout-minutes: 3
    # No `needs:`, deliberately. The `theocode` job above waits on `typecheck-build` because it
    # consumes the workspace packages from the `package-dist` artifact. This app does not: its
    # `@theokit/*` dependencies resolve to REGISTRY versions in the lockfile, not to `link:`
    # entries, so there is nothing built here for it to wait for. Adding the dependency anyway
    # would serialise a 10-minute job behind a 30-minute one for no verdict.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]

      # The three gates this package declares, each as its own step so a red run names which one
      # failed rather than reporting "the job failed". They were verified by hand in the session
      # that wrote them (B-004) and by nothing since — which is the item this job closes.
      - name: test
        run: pnpm --filter theoclaw test
      - name: typecheck
        run: pnpm --filter theoclaw run typecheck
      - name: boundaries
        run: pnpm --filter theoclaw run boundaries

  dependency-audit:
    name: Dependency audit (production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHA-pinned, unlike the tag references elsewhere in this file. A supply-chain gate that
      # resolves its own tooling through a movable tag can be silenced by whoever moves the tag.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          install-args: --ignore-scripts
      # `--ignore-scripts`: this job never builds or runs the tree, it only reads it. Executing
      # every dependency's install hooks to decide whether those dependencies are safe hands
      # arbitrary code to the thing under audit. `pnpm audit` works from the lockfile and
      # `check-licenses.mjs` uses only node builtins over the store, so neither loses anything.
      # `--prod` on purpose. A production advisory is inherited by every app built on the framework;
      # a dev-tree one never reaches a consumer and, measured today, would make this job permanently
      # red for findings nobody here can act on. A gate that is always red is a gate people learn to
      # skip, which is worse than not having it. The dev tree is reported, not enforced.
      - name: Production dependencies — no high or critical advisory
        run: pnpm audit --prod --audit-level=high
      - name: Full tree (reported, does not block)
        if: always()
        run: pnpm audit --audit-level=high || echo "::warning::dev-tree advisories above are reported, not enforced"

  doc-citations:
    name: Doc citations (file:line resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # No install: the gate reads the working tree with node's stdlib only.
      - run: node scripts/check-doc-citations.mjs

  env-verdicts:
    name: Environment list (closed, and current in both directions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # No install: the gate reads the working tree with node's stdlib only. That is not an
      # optimisation — it is FR-006, which says this check depends on nothing outside this
      # repository: no network, and no artifact derived from another product.
      - run: node scripts/check-env-verdicts.mjs

  changelog-current:
    name: Release record (no release newer than the record)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate compares the newest RELEASE TAG against the newest dated section, so the
          # tags have to be here. A shallow checkout fetches none, and the gate would report that
          # it could not measure — which is honest, and useless as a gate.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # No install: node's stdlib plus `git tag`.
      - run: node scripts/check-changelog-current.mjs

  changeset-coverage:
    name: Changeset coverage (a changed package is named)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate diffs against the base branch, so the base has to be here. A shallow checkout
          # has no merge base and the script exits 2 — honest, and useless as a gate.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # No install: node's stdlib plus `git diff`.
      #
      # The base is the PR's own, not always `main`. Measured on B-252: four `fix(http)` commits
      # each changed `packages/http/src` with no changeset, and each would have been refused at its
      # own merge, when the fix is one `pnpm changeset` away. Comparing everything to `main` would
      # instead fail whichever PR happened to follow the one that introduced the gap.
      - run: node scripts/check-changeset-coverage.mjs "origin/${BASE_REF:-main}"
        env:
          BASE_REF: ${{ github.base_ref }}

  license-compliance:
    name: License compliance (production tree)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned and script-free for the same reason as `dependency-audit` above.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          # NOT .nvmrc, and this is the one job where that is right. `rollup` carries
          # `@napi-rs/lzma-linux-x64-gnu` as an optionalDependency, and that package
          # declares `engines: node ^22.20 || ^24.12 || >=25`. On the 22.12.0 floor pnpm
          # correctly SKIPS it — optional dependencies exist for exactly that — and then
          # `pnpm licenses list` fails reading an index for a package it was told about
          # but never fetched.
          #
          # A licence audit run against a tree with packages missing audits less than the
          # consumer installs, so this job wants the COMPLETE tree, not the floor. The
          # floor is still exercised by the test matrix, which is where it belongs.
          #
          # `--no-optional` was measured and rejected as the fix: it takes the audit from
          # 551 packages to 163.
          node-version: '22'
          install-args: --ignore-scripts
      - run: pnpm check:licenses

  pr-report:
    name: Quality report (PR comment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `always()`: the report is most useful precisely when something failed. Without it the job is
    # skipped on the runs a reader most wants a summary of.
    #
    # The fork guard is not optional: a `pull_request` from a fork gets a read-only token, so
    # `pull-requests: write` is not granted and the comment step would fail on every external
    # contribution. Skipping is honest; the alternative (`pull_request_target`) would run this with
    # write permissions against untrusted code, which is the vulnerability that trigger is known for.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - lint-and-format
      - typecheck-build
      - test
      - type-tests
      - scaffold-typecheck
      - dead-code
      - package-validation
      - dependency-audit
      - doc-citations
      - license-compliance
    permissions:
      contents: read # Read the tree to build the report from.
      # The only write this job needs, and the only one it gets.
      pull-requests: write # Post the quality report as a pull-request comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Real numbers or none. The coverage-carrying leg of the `test` matrix uploads this; if it
      # failed there is no artifact, and the report says it could not read one rather than
      # printing a figure from somewhere else.
      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage-report
          path: coverage

      # The gates live across six workflows, so job results from `needs` would cover only this one.
      # Asking the API for every check run on the head SHA is the complete picture, and it does not
      # have to know any job's name. Bounded: after the wait, whatever is still running is REPORTED
      # as running — never assumed to have passed.
      - name: Collect check runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: Quality report (PR comment)
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" > checks.json
            remaining=$(jq --arg self "$SELF" \
              '[.check_runs[] | select(.name != $self and .status != "completed")] | length' checks.json)
            [ "$remaining" = "0" ] && break
            echo "aguardando $remaining check(s)…"
            sleep 20
          done

      - name: Render report
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          # This job is itself a check run, and necessarily unfinished while it renders.
          SELF: Quality report (PR comment)
        run: |
          node scripts/pr-quality-report.mjs \
            --checks checks.json \
            --coverage coverage/coverage-summary.json \
            --sha "${SHA:0:9}" \
            --self "$SELF" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment, updated in place. A new comment per push turns a long PR into a wall of stale
      # reports, and the stale ones are indistinguishable from the current one at a glance.
      - name: Post or update the report comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --jq 'map(select(.body | contains("<!-- theokit:quality-report -->"))) | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@report.md > /dev/null
            echo "comentário $existing atualizado"
          else
            gh pr comment "$PR" --body-file report.md
          fi

  # SonarQube Cloud, from CI rather than Automatic Analysis.
  #
  # Automatic Analysis cannot import coverage — "code coverage information is not supported" in
  # its documentation — so the gate saw bugs and smells and nothing about what the suite reaches.
  # `vitest.config.ts` already emits lcov to `./coverage`; nothing was reading it.
  #
  # The workflow is shared rather than inlined. The ecosystem's only inline version carried
  # `if: matrix.node-version == '22.x'` against a matrix of ['22.12', '22'] — a value that never
  # occurs — so it reported `skipped` on every run for two months, which renders exactly like a
  # passing step.
  #
  # Automatic Analysis is OFF for this project; the scanner refuses to run beside it with
  # "You are running CI analysis while Automatic Analysis is enabled."
  sonar:
    needs: test
    # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
    # caller without eleven pull requests, which is the reason that repository exists.
    uses: usetheokit/shared-workflows/.github/workflows/sonar.yml@v1 # zizmor: ignore[unpinned-uses]
    # Named rather than inherited: `secrets: inherit` would hand the scanner every secret
    # this repository holds.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # Not re-run here: the `test` job above rebuilds native bindings and installs bubblewrap —
      # 89 suites fail to load without that, which is exactly what the first scan hit while still
      # reporting green. (The sibling theokit-sdk checkout used to be in this list and was removed:
      # the lockfile never referenced it and the suite is identical with and without it — #551.)
      # Reading its artifact also means Sonar publishes the number this repo's own gate measured.
      coverage-artifact: coverage-report

  # The one check branch protection should require.
  #
  # `pr-report` already gathers every job, but only on pull requests from this repository — a
  # push to a long-lived branch produces no such check, and neither does a PR from a fork. This
  # one runs on every event.
  #
  # WHY IT MATTERS BEYOND TIDINESS. Requiring individual jobs works only while each runs on every
  # event. The moment a job becomes conditional — a matrix leg skipped on pull requests, a path
  # filter, a shard that only exists for some runs — a required check that never reports sits at
  # "Expected — Waiting for status to be reported" and the pull request can never merge. Branch
  # protection cannot tell "deliberately skipped" from "not reported yet". A sibling repository
  # hit exactly that this morning and had to revert the change rather than fix it.
  #
  # A SKIPPED dependency counts as a pass; a failed or cancelled one does not. `cancelled` is
  # checked too, or the concurrency group's own cancellations would report green.
  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint-and-format
      - typecheck-build
      - test
      - type-tests
      - scaffold-typecheck
      - dead-code
      - package-validation
      - theoclaw
      - changeset-coverage
      # `theocode` and `env-verdicts` were outside this list until 2026-09-18 (B-183). A job
      # absent from it still runs and still shows a red X on the pull request, and the required
      # check on the branch is `ci-ok` — so it could not hold a merge. `pr-report` stays out
      # deliberately and is explained at its own definition: it runs on `always()`, so it
      # reports success when everything under it failed.
      - theocode
      - env-verdicts
      - dependency-audit
      - doc-citations
      - changelog-current
      - license-compliance
      - sonar
      - release-channel
    steps:
      # Was an inline grep over the serialized results, duplicated in four repositories.
      # It read only `failure` and `cancelled`, so a job that SKIPPED counted as a pass —
      # and a job that did not run reads exactly like one that did. The shared action
      # fails on an undeclared skip, and one implementation replaces four.
      #
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach
      # every caller without nine pull requests, which is the reason that repo exists.
      - uses: usetheokit/shared-workflows/actions/checks-pass@v1 # zizmor: ignore[unpinned-uses]
        with:
          needs: ${{ toJSON(needs) }}

  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every caller
      # without seven pull requests, which is the reason that repository exists.
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]
