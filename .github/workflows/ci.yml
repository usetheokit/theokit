name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Both promotion legs are pull requests — workspace -> develop and develop -> main — so
    # both bases belong here. Until 2026-08-19 only `main` was listed, so the nine quality
    # jobs below never ran on the first leg: a PR into `develop` reported no check at all.
    # That is also why `develop` could not be protected — requiring a context no workflow
    # emits blocks every PR forever, so the branch was left with an empty required list,
    # which reads as protection and demands nothing.
    branches: [main, develop]

# Quality gates — every job runs on every PR. A failing job blocks merge.

# tsup DTS build for theokit's ~24 entrypoints OOMs the runner's default worker
# heap (ERR_WORKER_OUT_OF_MEMORY). Raise it workflow-wide.
env:
  NODE_OPTIONS: --max-old-space-size=8192

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  lint-and-format:
    name: Lint + Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      # The type-aware ESLint rules resolve `@theokit/agents` through its package
      # `types` field, which points at `dist/`. On a fresh checkout that directory
      # does not exist, every type crossing the package boundary resolves to an
      # `error` type, and the rules report it as `acts as 'any'` — a red job whose
      # message points at application code that is not wrong.
      #
      # It passed locally because `dist/` was left over from an earlier build, so
      # the local lint gate had been giving false assurance for as long as this job
      # had been red. Proven by removing `packages/agents/dist` locally: the exact
      # CI errors appear, and restoring it returns exit 0.
      - run: pnpm build:packages
      - name: ESLint (strict — zero warnings)
        run: pnpm lint
      - name: Prettier (format check)
        run: pnpm format:check

  typecheck-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      # Sibling theokit-sdk is declared as a workspace member in
      # pnpm-workspace.yaml (`../theokit-sdk/packages/{sdk,gateway,gateway-telegram}`).
      # pnpm-lock.yaml lists those packages with `link:` paths — pnpm install
      # expects the files on disk. `dist/` isn't committed so we also build
      # the SDK before consuming it (typecheck needs the type entries to
      # resolve at `./dist/index.d.ts`). Public repo, anonymous clone OK.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheokit/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      # Build BEFORE typecheck: tests/smoke/import-validation.test.ts
      # imports from `packages/theo/dist/*` to validate the npm publish
      # surface — those files don't exist until build runs.
      # Filter to packages/* only: `pnpm -r build` would walk examples
      # too, which call `theokit build` (needs the bin from packages/theo,
      # but the binstub points to dist/cli/index.js which doesn't exist
      # until the theo package finishes building → ordering blow-up).
      - run: pnpm build:packages
      - run: pnpm typecheck

  test:
    name: Unit + Type tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Node 20 was dropped (backlog B-M67-19).
        #
        # Every manifest here declares `engines.node: ">=22.12.0"`, and the CLI does not merely warn —
        # it REFUSES: `[theokit preflight] theokit requires node >= 22.12.0 (you are running
        # v20.20.2)`. So the Node-20 leg was exercising a configuration the product explicitly does
        # not support, and every test that shells out to the CLI failed there by design.
        #
        # It surfaced only now because those tests used to die earlier, on `pnpm exec theokit` not
        # resolving the bin at all (B-M67-17). Fixing the resolution let the CLI actually run, and the
        # next layer — the engine floor — became visible. A red leg that can never be green is the
        # shape this cycle spent its time removing.
        #
        # Restoring a second version means first deciding to support it: lower the floor in `engines`,
        # or the leg is theatre.
        node-version: ['22.12', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      # Sibling theokit-sdk: workspace member declared in pnpm-workspace.yaml.
      # `dist/` isn't committed → build after clone so type entries resolve.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheokit/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      # dogfood-regressions-fix-plan v1.1 T4.2 — defense in depth against
      # NODE_MODULE_VERSION mismatch. CRITICAL here because the matrix runs
      # both Node 20 and Node 22 against the same pnpm store (cache); the
      # binding installed under one Node version cannot dlopen under the
      # other. Without this step the matrix would silently break.
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"
      # Build packages before running tests so the integration tests that
      # exercise `theokit build` (cron/job manifest tests, scaffold-build-start
      # E2E) find the bin at `packages/theo/dist/cli/index.js`.
      - run: pnpm build:packages
      # M75 T1.2 — the kernel-confinement tests need bubblewrap. `apt install` alone is NOT enough
      # on ubuntu-latest: Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and the
      # active probe (`bwrap --unshare-user ...`) fails with "user namespaces unavailable
      # (container/kernel restriction)". Measured: the binary installed and 10 tests KEPT skipping;
      # only after the sysctl did they reach 856 passed | 0 skipped.
      #
      # The smoke check at the end fails the step if userns is still blocked — without it a skipped
      # confinement test reports green, and the gate would certify by absence of execution.
      - name: Install bubblewrap + enable unprivileged userns (kernel-confinement tests)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true && echo "bwrap OK: userns liberado"
      - run: pnpm test
      - run: pnpm test:types

  coverage:
    name: Coverage gate (>=80%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      # Sibling theokit-sdk: workspace member declared in pnpm-workspace.yaml.
      # `dist/` isn't committed → build after clone so type entries resolve.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheokit/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"
      # Build packages before tests — same rationale as `test` job above.
      - run: pnpm build:packages
      - name: Run tests with coverage thresholds
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  dead-code:
    name: Dead code (Knip)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      # Sibling theokit-sdk: workspace member declared in pnpm-workspace.yaml.
      # `dist/` isn't committed → build after clone so type entries resolve.
      - name: Checkout + build sibling theokit-sdk (workspace dep)
        run: |
          git clone --depth 1 https://github.com/usetheokit/theokit-sdk.git ../theokit-sdk
          (cd ../theokit-sdk && pnpm install --no-frozen-lockfile && pnpm --filter "./packages/*" build)
      - run: pnpm install --frozen-lockfile
      # Build packages first so knip can resolve theokit's dist exports.
      - run: pnpm build:packages
      - run: pnpm knip

  package-validation:
    name: Package validation (publint + ATTW + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-format, typecheck-build, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm validate:publint
      - run: pnpm validate:attw
      - run: npx vitest run tests/smoke/

  # Supply chain. Both jobs were deleted in a cleanup pass and left no replacement — an advisory in
  # a transitive dependency, or a copyleft package entering a tree that publishes to npm, was caught
  # by nothing. Neither reimplements a tool: audit is pnpm's own, and the licence gate reads pnpm's
  # report and applies a policy that lives in the repository.
  dependency-audit:
    name: Dependency audit (production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHA-pinned, unlike the tag references elsewhere in this file. A supply-chain gate that
      # resolves its own tooling through a movable tag can be silenced by whoever moves the tag.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      # `--ignore-scripts`: this job never builds or runs the tree, it only reads it. Executing
      # every dependency's install hooks to decide whether those dependencies are safe hands
      # arbitrary code to the thing under audit. `pnpm audit` works from the lockfile and
      # `check-licenses.mjs` uses only node builtins over the store, so neither loses anything.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `--prod` on purpose. A production advisory is inherited by every app built on the framework;
      # a dev-tree one never reaches a consumer and, measured today, would make this job permanently
      # red for findings nobody here can act on. A gate that is always red is a gate people learn to
      # skip, which is worse than not having it. The dev tree is reported, not enforced.
      - name: Production dependencies — no high or critical advisory
        run: pnpm audit --prod --audit-level=high
      - name: Full tree (reported, does not block)
        if: always()
        run: pnpm audit --audit-level=high || echo "::warning::dev-tree advisories above are reported, not enforced"

  doc-citations:
    name: Doc citations (file:line resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # No install: the gate reads the working tree with node's stdlib only.
      - run: node scripts/check-doc-citations.mjs

  license-compliance:
    name: License compliance (production tree)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned and script-free for the same reason as `dependency-audit` above.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:licenses
