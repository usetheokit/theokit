name: architecture-guards

# Enforces the architecture rules + naming convention on every PR.
#
# Fails the build on:
#   • Cyclic dependencies (Acyclic Dependencies Principle — consensus)
#   • `core/` reaching outside itself (INVARIANT)
#   • Filename violating kebab-case (or React PascalCase/camelCase use*)
#
# Path-filtered: only fires when src/ or the rule files change.

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/theo/src/**'
      - '.dependency-cruiser.cjs'
      - '.ls-lint.yml'
      - 'packages/*/package.json'
      # M91 — the whole package suite, not just two entries. Listing only `sandbox-entry.ts` and
      # `auth-entry.ts` meant a PR touching `src/capability/toolset.ts` or `tests/unit/*` triggered
      # nothing, and the M91 gates ran only by accident: the release commit happened to touch
      # `package.json`, which was on the list.
      - 'packages/agents/src/**'
      - 'packages/agents/tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/theo/src/**'
      - '.dependency-cruiser.cjs'
      - '.ls-lint.yml'
      - 'packages/*/package.json'
      # M91 — the whole package suite, not just two entries. Listing only `sandbox-entry.ts` and
      # `auth-entry.ts` meant a PR touching `src/capability/toolset.ts` or `tests/unit/*` triggered
      # nothing, and the M91 gates ran only by accident: the release commit happened to touch
      # `package.json`, which was on the list.
      - 'packages/agents/src/**'
      - 'packages/agents/tests/**'

jobs:
  agents-surface:
    name: surface parity (the layer enriches the SDK, never reduces it — M73)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The M90 surface gate (`subpath-surface.test.ts` in the package) reads `dist/*.d.ts`, not the
      # source, because the `.d.ts` is what the consumer actually sees. Without a build it dies on
      # ENOENT and the whole job fails without measuring anything — which is what happened on every
      # run from 2026-07-30. `...` pulls in the package's workspace dependencies (@theokit/http,
      # presenter), required by tsup's DTS. TURBO_CONCURRENCY=1 because the DTS for ~24 entrypoints
      # blows the runner's default heap.
      - run: TURBO_CONCURRENCY=1 pnpm --filter "@theokit/agents..." build
      # The referential-identity lock (`toBe`) lives in the package's own tests, and the root vitest
      # run only covers `tests/**` — without this it would never run in CI.
      - run: pnpm --filter @theokit/agents test

  dep-cruiser:
    name: dependency-cruiser (architecture rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps

  ls-lint:
    name: ls-lint (filename convention)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:naming

  wire-ownership:
    name: wire ownership (no published package carries the ai-sdk)
    runs-on: ubuntu-latest
    # The DTS for theokit's ~24 entrypoints blows the runner's default heap
    # (ERR_WORKER_OUT_OF_MEMORY). `release.yml` carries the same line for the same reason.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # Pinned by SHA: a tag is mutable, and a workflow that installs dependencies would otherwise
      # trust whatever the tag points at on the day.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      # `--ignore-scripts`: this job only builds and inspects; no lifecycle script is needed, and
      # allowing them widens the supply-chain surface for nothing.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: TURBO_CONCURRENCY=1 pnpm --filter "./packages/*" build
      - run: pnpm --filter @theokit/presenter test
      # The check this job is NAMED for. It was absent: the job installed, built and ran the
      # presenter's tests, and nothing inspected a built surface for the ai-sdk — so it certified by
      # absence of execution, which is worse than having no job at all.
      #
      # The floor is the other half. A scan that finds no dist/ reports "0 files import ai" and
      # passes, which is exactly the shape being fixed; so an empty scan FAILS instead.
      - name: no published package carries the ai-sdk
        run: |
          node --input-type=module -e '
            import { readdirSync, statSync, readFileSync } from "node:fs"
            import { join } from "node:path"

            const IMPORTS_AI = /(?:from\s*|require\(\s*)["\x27]ai["\x27]/
            const walk = (dir) =>
              readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
                const p = join(dir, e.name)
                return e.isDirectory() ? walk(p) : /\.(?:js|mjs|cjs|d\.ts)$/.test(e.name) ? [p] : []
              })

            const pkgs = readdirSync("packages", { withFileTypes: true })
              .filter((e) => e.isDirectory())
              .map((e) => join("packages", e.name))
              .filter((p) => { try { return statSync(join(p, "dist")).isDirectory() } catch { return false } })

            if (pkgs.length === 0) {
              console.error("no packages/*/dist found — the build did not run, so this gate measured nothing")
              process.exit(1)
            }

            let scanned = 0
            const offenders = []
            for (const p of pkgs) {
              for (const f of walk(join(p, "dist"))) {
                scanned++
                if (IMPORTS_AI.test(readFileSync(f, "utf8"))) offenders.push(f)
              }
            }
            if (scanned === 0) {
              console.error("scanned 0 files across " + pkgs.length + " dist directories — vacuous")
              process.exit(1)
            }
            console.log("scanned " + scanned + " built files across " + pkgs.length + " packages")
            if (offenders.length > 0) {
              console.error("published surface imports the ai-sdk:")
              for (const o of offenders) console.error("  " + o)
              process.exit(1)
            }
            console.log("no published package carries the ai-sdk")
          '
