name: Dogfood Stranger
# theokit-evolution-ci-and-dx Phase 1A — opt-in dogfood gate (D1 + D8).
# Manual + weekly schedule. NUNCA `on: push` (cost + duration).
# Custo operacional: ~$0.10/mês (D11 EC-14 DOCUMENT).

on:
  workflow_dispatch:
    inputs:
      templates:
        description: 'Templates to test (comma-separated or "all")'
        default: 'all'
        required: false
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC

concurrency:
  group: dogfood-stranger
  cancel-in-progress: false

jobs:
  preflight:
    # theokit#152 — the key decides whether the run HAPPENS, not whether it FAILS.
    #
    # This job used to `exit 1` when the secret was absent. The secret was never configured, so the
    # scheduled run failed at its first step every single day and the repo sat at 0/20 green. The
    # defect graded MEDIUM on its own; the side effect is worse — a permanent red trains the team to
    # ignore the dashboard, which is precisely how a real failure would go unnoticed here.
    #
    # The original rationale was sound and is preserved: helpers that SKIP gracefully would make the
    # matrix exit 0, and "no provider key" would read as a passing dogfood. That is a false PASS, and
    # it must not happen. But "fail" is not the only alternative to "false pass" — the job can decide
    # NOT TO RUN, which is what an unconfigured key actually means. That is the ecosystem pattern
    # (theo-memory ADR D4: "without it the tier SKIPs honestly and never fabricates a passing score").
    #
    # The distinction is enforced by `outputs.enabled`: downstream jobs are gated on it, so with no
    # key they never execute — and a skipped job is not a green job. Nothing reports a dogfood that
    # did not happen.
    #
    # `env` at job level, then `if: env.X != ''` — NOT `if: secrets.X != ''`, which GitHub rejects at
    # parse time (usetheodev/theo-memory#155, same family of defect).
    name: Preflight — is the dogfood runnable?
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check provider key
        id: check
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY is not configured — the dogfood is SKIPPED, not passed."
            echo "::warning::Nothing below runs, so no result is reported for a run that did not happen."
            echo "::warning::To enable: gh secret set OPENROUTER_API_KEY --repo <owner>/<repo>"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "✓ provider key present (length: ${#OPENROUTER_API_KEY})"

  multi-template-smoke:
    name: Multi-template smoke (${{ matrix.template }})
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # theokit#152 (second defect, found while fixing the first) — this matrix listed `dashboard`,
        # `api-only`, `postgres` and `saas`. ADR-0023 narrowed the shipped template set to `default`
        # only and REMOVED those four, so every leg would have scaffolded a template that no longer
        # exists. Nobody noticed because preflight failed first, every time: one broken gate was
        # hiding the next one behind it.
        include:
          - template: default
            port: 4100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm 11 via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate
      - name: Install lsof (helper dep)
        run: sudo apt-get update && sudo apt-get install -y lsof curl
      - name: Smoke ${{ matrix.template }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          OUTPUT=$(bash scripts/dogfood/multi-template-smoke.sh ${{ matrix.template }} ${{ matrix.port }})
          echo "$OUTPUT"
          RESULT=$(echo "$OUTPUT" | grep '^RESULT=' | cut -d= -f2)
          REASON=$(echo "$OUTPUT" | grep '^REASON=' | cut -d= -f2-)
          if [[ "$RESULT" != "PASS" && "$RESULT" != "SKIP" ]]; then
            echo "::error::Template ${{ matrix.template }} FAILED: $REASON"
            exit 1
          fi
          if [[ "$RESULT" == "SKIP" ]]; then
            echo "::warning::Template ${{ matrix.template }} SKIPPED: $REASON"
          fi

  chaos-providers:
    name: Chaos providers (D14 fault injection)
    needs: [preflight, multi-template-smoke]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.1.0 --activate
      - run: sudo apt-get update && sudo apt-get install -y lsof curl
      - name: Scaffold base sandbox
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p /tmp/chaos-sandbox && cd /tmp/chaos-sandbox
          npx -y create-theokit@latest my-app --template=default --skip-install
          cd my-app
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" > .env
          pnpm install --prefer-offline || true
          ls node_modules/theokit >/dev/null
      - name: Run chaos scenarios (D14)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          declare -A SCENARIO_PORTS=(
            [invalid-key]=3100
            [rate-limit]=3200
            [nonexistent-model]=3300
            [server-error]=3400
          )
          failed=0
          for scenario in invalid-key rate-limit nonexistent-model server-error; do
            PORT=${SCENARIO_PORTS[$scenario]}
            OUT=$(bash "${GITHUB_WORKSPACE}/scripts/dogfood/chaos-providers.sh" "$scenario" /tmp/chaos-sandbox/my-app "$PORT")
            echo "=== $scenario (port $PORT) ==="
            echo "$OUT"
            RES=$(echo "$OUT" | grep '^RESULT=' | cut -d= -f2)
            REA=$(echo "$OUT" | grep '^REASON=' | cut -d= -f2-)
            if [[ "$RES" == "PASS" ]]; then
              echo "::notice::Chaos $scenario PASS — $REA"
            elif [[ "$RES" == "SKIP" ]]; then
              echo "::warning::Chaos $scenario SKIP — $REA"
            else
              echo "::error::Chaos $scenario FAIL — $REA"
              failed=$((failed+1))
            fi
          done
          exit $failed

  upload-artifacts:
    name: Upload dogfood report
    needs: [preflight, multi-template-smoke, chaos-providers]
    # `always()` alone also fires when the dogfood was SKIPPED, publishing an empty report as if a
    # run had happened — the exact false signal theokit#152 is about. Gated on the same flag.
    if: always() && needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find reports
        id: reports
        run: |
          mkdir -p reports
          if [ -d .claude/knowledge-base/reviews/dogfood-stranger ]; then
            cp .claude/knowledge-base/reviews/dogfood-stranger/*.md reports/ 2>/dev/null || true
          fi
          ls reports/
      - uses: actions/upload-artifact@v4
        with:
          name: dogfood-stranger-report
          path: reports/
          if-no-files-found: warn
