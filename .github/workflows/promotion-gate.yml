# `develop` accepts one thing: the promotion from `workspace`.
#
# The gate itself lives in `usetheokit/shared-workflows` and is called by ref, so a change to the
# POLICY reaches every repository that calls it. It was copied into ten repositories until
# 2026-09-05, when nine of the ten turned out to hold byte-identical copies and the tenth held a
# variant with two improvements the other nine had never received. The reasoning, the measured
# history behind the gate, and what it deliberately does not cover are all documented at the top of
# the shared workflow.
#
# NO `paths:` FILTER, deliberately. This check is required in branch protection, and a required
# check that does not run on some pull requests deadlocks them permanently.
#
# THE CHECK NAME IS PART OF THE CONTRACT. A called workflow reports as
# `<caller job id> / <called job name>`, so this file's job id and the shared workflow's job name
# together produce `promotion-gate / develop accepts only workspace`. That exact string is what
# branch protection requires; renaming either half silently stops the required check from ever
# reporting, which blocks every pull request into `develop` rather than failing one.
name: Promotion gate

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  promotion-gate:
    uses: usetheokit/shared-workflows/.github/workflows/promotion-gate.yml@v1 # zizmor: ignore[unpinned-uses]
