name: Preview releases

# Per-commit package previews on pkg.pr.new — never npm, so nothing here burns a version.
#
# A fix in this repository is unverifiable from a sibling repository until it is on a registry: an
# example or a package that resolves through a workspace tests the repository it lives in, not the
# experience of the person who typed `npm install`. This ecosystem has nine interdependent
# publishable repositories, which is why that gap is where its expensive defects live.
#
# Reach for this first. `release.yml`'s snapshot path publishes to the real registry under a
# non-`latest` dist-tag and burns an immutable npm version — that is for when the answer has to
# come from registry.npmjs.org specifically.
#
# The implementation is shared rather than copied nine times; see
# usetheokit/shared-workflows/.github/workflows/preview.yml.
#
# ## Installing a preview on pnpm 11: ERR_PNPM_EXOTIC_SUBDEP (#632)
#
# A consumer pinning ONE preview of a package from this monorepo can be refused before anything is
# downloaded:
#
#   [ERR_PNPM_EXOTIC_SUBDEP] Exotic dependency "@theokit/presenter" (resolved via url) is not
#   allowed in subdependencies when blockExoticSubdeps is enabled
#
# The preview is not broken, and neither is the consumer's manifest. pkg.pr.new rewrites the
# internal dependencies of everything published in the SAME invocation to preview URLs, so the
# preview of `@theokit/agents` declares `@theokit/presenter` as a URL. One level down from the
# consumer that is a SUBdependency, and pnpm 11 ships `blockExoticSubdeps: true` by default.
#
# The workaround is `blockExoticSubdeps: false` in the consuming workspace. It works — measured on a
# real consumer, 94 files / 753 tests green on a preview build — and it is a poor trade: the guard
# goes off for the whole tree, not for the pinned preview, and stays off afterwards. Prefer it for
# the length of the verification and put it back.
#
# Measured 2026-09-02, both halves: `pkg-pr-new@0.0.88 --help` offers no flag to keep an internal
# dependency on its registry range, and `pnpm pack` on `packages/agents` ALREADY writes
# `"@theokit/presenter": "0.8.0"` (from `workspace:*`) — so the URL comes from the cross-package
# rewrite, not from the manifest. Publishing fewer packages per invocation would avoid it, at the
# cost of a preview that cannot carry an unpublished change in a sibling. That decision belongs with
# the shared workflow, not here.

on:
  # Filtered by BASE branch, and that is the only lever there is: `pull_request` has no head-branch
  # filter, and a job-level `if:` cannot help — GitHub decides whether a run needs approval BEFORE
  # any job is evaluated, so the run is created, held, and expires regardless.
  #
  # A back-merge is `main -> workspace`, so excluding `workspace` as a base removes exactly the
  # pull requests that expire. It is opened by `github-actions[bot]`, whose runs GitHub holds for
  # manual approval; nobody approves them, and each lands in the checks list as a failure meaning
  # "a preview nobody needed was not produced".
  #
  # THE COST, stated rather than discovered: a Dependabot pull request also targets `workspace`, so
  # it no longer previews before merge. The `push` trigger below still previews the moment it lands,
  # which is a few minutes later and the same packages.
  pull_request:
    branches: [develop, main]
  # Work is born on `workspace` and only meets a pull request at promotion time, so a fix would
  # otherwise sit here with no preview during the window it is most worth iterating on. A push with
  # no pull request gets a `@workspace` tag rather than a comment.
  push:
    branches: [workspace]

permissions: {}

# Keyed on the EVENT and the COMMIT. One group per commit used to collapse the `push` run and the
# pull-request run that carry the same SHA, and it did publish one preview. The cost was that the
# loser was CANCELLED, and GitHub reports a cancelled run as a failed check, so every promotion pull
# request carried a red `preview` on a commit whose preview had succeeded (#903).
#
# Now the two never share a group, so neither cancels the other, and the duplicate is avoided
# before it starts instead: the `push` run asks whether an open pull request already carries this
# commit, and stands down if one does. A standing-down job reports `skipped`, which is not red. The
# pull-request run is still the one that publishes, for the reason it was before: it comments on the
# pull request, where the push run only moves a `@workspace` tag.
#
# Inside a group, a newer run of the same event on the same commit (a re-run) still replaces an
# older one.
concurrency:
  group: preview-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Only the `push` run asks. If the lookup itself fails, `carried` stays empty and the preview
  # runs: a duplicate preview costs a minute, a missing one costs the verification it was for.
  pull-request-carries-this-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      carried: ${{ steps.lookup.outputs.carried }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The bases are the ones `on.pull_request.branches` previews. A pull request into any other
        # base gets no preview run of its own, so the push run must not stand down for it.
        run: |
          count="$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.sha == \"${SHA}\" and (.base.ref == \"develop\" or .base.ref == \"main\"))] | length")"
          if [ "${count}" -gt 0 ]; then carried=true; else carried=false; fi
          echo "carried=${carried}" >> "$GITHUB_OUTPUT"
          echo "open pull requests into develop/main carrying ${SHA}: ${count}"

  preview:
    needs: pull-request-carries-this-commit
    # `!cancelled()` because `needs` is skipped on a pull-request run, and a skipped dependency
    # would otherwise skip this job too.
    if: ${{ !cancelled() && needs.pull-request-carries-this-commit.outputs.carried != 'true' }}
    uses: usetheokit/shared-workflows/.github/workflows/preview.yml@v1 # zizmor: ignore[unpinned-uses] first-party moving major, ADR-0021
    with:
      # #632 — publish the packages THIS commit touched, not all seven.
      #
      # pkg.pr.new rewrites internal dependencies to preview URLs across everything in ONE
      # invocation, so publishing all seven made each preview declare its siblings as URLs. From the
      # consumer's side that is an exotic SUBdependency, which a default pnpm 11 refuses outright —
      # the preview exists for exactly that consumer.
      #
      # Scoping keeps the property the cross-rewrite is FOR. A change inside one package publishes
      # one package, so its siblings stay on registry ranges and the preview installs; a change
      # spanning two publishes both, so the URL between THEM survives, which is the case that needs
      # it. Publishing one package per invocation would have removed the cross-URL everywhere,
      # including where it is required.
      #
      # The `git fetch` is what makes the diff readable at all: the shared workflow checks out
      # shallow, so `origin/develop` is not there until asked for. It is `|| true` on purpose —
      # if it fails, the script finds no diff and prints every package, which is exactly what this
      # workflow did before. Failing WIDE keeps a preview being produced; failing narrow would
      # silently stop previewing the package somebody was about to verify.
      # The refspec is explicit and that is the whole trick: `actions/checkout` configures the
      # remote to track ONLY the ref it checked out, so a bare `git fetch origin develop` downloads
      # the objects and creates no `refs/remotes/origin/develop` for `git diff` to name. Measured on
      # run 33684696268 — the script reported "could not read a diff" and previewed all seven.
      #
      # stderr is NOT silenced: when the fetch fails, the reason belongs in the log. `|| true` keeps
      # the failure non-fatal, because the script then prints every package, which is what this
      # workflow did before scoping existed.
      # `--pnpm`, and without it the scoping above publishes something WORSE than the URL it removes.
      #
      # pkg-pr-new runs `npm pack` by default, and npm does not understand `workspace:*` — so the
      # published manifest carries the protocol verbatim and no external consumer can resolve it.
      # Publishing every package in one invocation hid this: the cross-package rewrite replaced each
      # `workspace:*` with a preview URL on its way out. Take the rewrite away, and the raw protocol
      # is what ships.
      #
      # Measured on the preview this workflow produced for d2903f1cc — `@theokit/presenter` came out
      # as `workspace:*`. `pnpm pack` resolves it to the real version (`0.8.0`), which is what makes
      # the preview installable, and `--pnpm` is what selects it.
      #
      # The version is repeated here because `pkg-pr-new-version` is documented as ignored when
      # `publish-command` is given; keeping it pinned is the point of that input.
      # Scoped to the publishable packages, which is what this workflow publishes previews OF.
      #
      # The shared workflow's default build is recursive, and on 2026-09-16 `apps/theocode` joined
      # the workspace — a PRIVATE application that esbuilds against `@theokit/agents/*` subpaths.
      # The recursive build reached it before the framework's dist existed and failed with 77
      # `Could not resolve` errors, in a job whose purpose has nothing to do with that package.
      #
      # `build:packages` is the filter this repository already uses for the same reason in
      # `ci.yml` — "Filter to packages/* only: `pnpm -r build` would walk examples" — so this
      # reuses the declaration rather than spelling a second one that can drift from it.
      build-command: pnpm build:packages
      publish-command: >-
        pnpm dlx pkg-pr-new@0.0.88 publish --pnpm $DIRS
      packages-command: >-
        git fetch --quiet --depth=50 origin
        +refs/heads/${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}
        || true;
        PREVIEW_DIFF_BASE=origin/${{ github.base_ref || 'develop' }} node scripts/preview-packages.mjs
