# `main` must not leave the long-lived branch behind after a release.
#
# The job itself lives in `usetheokit/shared-workflows` and is called by ref, so a change to the
# POLICY reaches every repository that calls it. It was copied into three repositories under two
# file names until 2026-09-05 — which is also why a grep for one name reported two instances
# instead of three.
#
# WHY A PULL REQUEST AND NOT A DIRECT PUSH, decided by measurement rather than preference. The
# objection to the push is that it bypasses review; measured across all ten consumers, `workspace`
# carries NO branch protection anywhere, so neither mechanism bypasses anything. What decided it
# was the opposite worry: a pull request only helps if somebody merges it. Twelve back-merge pull
# requests, twelve merged, ten of them the same day — so the reviewable record costs nothing.
name: Back-merge

on:
  push:
    branches: [main]
  workflow_dispatch:

# `contents: read` and nothing else. The back-merge job below declares the `pull-requests: write`
# it needs on itself (and a `uses:` job only ever receives what the caller grants it explicitly),
# so granting write HERE widened the default for every job the file might later gain without
# widening anything the job it has can do. Narrowing it changes no behaviour today; it stops the
# next job added to this file from silently inheriting a write token nobody chose to give it.
permissions:
  contents: read

jobs:
  backmerge:
    uses: usetheokit/shared-workflows/.github/workflows/backmerge.yml@v1 # zizmor: ignore[unpinned-uses] first-party moving major, ADR-0021
    permissions:
      contents: read # Read both branches to compute the back-merge.
      pull-requests: write # Open the back-merge pull request. The only write, per the note above.
