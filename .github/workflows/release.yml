name: Release

# Per technical-hardening-sprint plan v1.1 T1.1 (UPDATE):
# Drop NPM_TOKEN env (EC-2 absorbed — disables OIDC trusted-publisher silently).
# Add id-token: write permission so changesets/action exchanges OIDC token
# with npm for provenance attestation.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# tsup builds DTS for theokit's ~24 entrypoints in a worker; the runner's default
# heap OOMs it (ERR_WORKER_OUT_OF_MEMORY). Raise the heap workflow-wide so the
# build step (and the changesets publish build) succeeds. Workers inherit NODE_OPTIONS.
env:
  NODE_OPTIONS: --max-old-space-size=8192

permissions:
  contents: read

jobs:
  # The last line, for the path that reached a release without passing through a pull request.
  # If the declared channel and `.changeset/pre.json` disagree, this release would publish under
  # the wrong dist-tag — most expensively, a stable version onto `latest` after an accidental
  # `changeset pre exit`, with the publish reporting success.
  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]

  release:
    needs: release-channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Actions pinned by commit SHA rather than by ref, because this job publishes as this
      # organization and a moving ref decides what runs here. `changesets/action@v1` was the
      # sharpest edge: `v1` is not a tag in that repository, it is a BRANCH — the tag lookup
      # returns 404 and the branch head is what resolves — so any push to it changed the code
      # running in this job, with no release and no version bump to notice.
      #
      # Each pin carries the version it resolved to on 2026-08-21, read from the action's own
      # tags rather than assumed from the ref name. Majors are deliberately unchanged: pinning
      # freezes what already runs, upgrading is a separate decision with its own risk.
      # Mint a short-lived token from the `theokit-release` GitHub App. GitHub does not start
      # workflow runs from GITHUB_TOKEN-authored events, so a Version Packages pull request
      # opened with that token arrives with none of its required checks running, and a
      # required check that never reports cannot be satisfied. An App-authored event does
      # start them. Proven on theokit-ui: 0/3 required checks became 3/3, the pull request
      # reached CLEAN by itself, and 1.10.1 published with no manual gesture.
      #
      # The token is minted per run and expires with it. What is long-lived is the App's
      # private key, an organization secret scoped to three repository permissions. NOT used
      # for npm — publishing stays OIDC trusted publishing, with no token at all.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to what this job does rather than inheriting whatever the
          # installation holds. zizmor flags the unrestricted form as high severity.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # The one checkout in this repository that keeps its credential, and not
          # by oversight: changesets/action pushes the version commit and the
          # release tags with the git CLI, which authenticates from exactly this
          # persisted token. `persist-credentials: false` breaks the release.
          #
          # It must be the APP's token. The push of `changeset-release/main` is what the
          # pull request is opened against, so a push carrying the Actions bot's credential
          # produces a bot-authored branch and the checks stay dormant even though the pull
          # request was opened by the App. Both halves have to be the App or neither is.
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
      # caller without nine pull requests, which is the reason that repository exists. What the
      # action RUNS stays pinned: every action inside it by digest, Node from `.nvmrc`, and pnpm
      # from `packageManager`, so neither version is named twice.
      #
      # It carries the cache key this block spelled out — `package.json` beside `pnpm-lock.yaml`,
      # because setup-node keys the pnpm store on the lockfile alone, so a pnpm 9 → 10 bump would
      # leave the key identical and restore a store the new pnpm reads as inconsistent
      # (`ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`).
      #
      # It also deliberately does NOT pass `registry-url`, which is the property this file needs
      # most: setup-node would write `_authToken=${NODE_AUTH_TOKEN}` into an npmrc unconditionally
      # and nothing exports that token under OIDC, so the publish would run against a config
      # naming a credential that does not exist.
      #
      # `install: false` — the frozen install stays where it is below, AFTER the npm upgrade,
      # because the order is load-bearing and this change is about the toolchain block only.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          install: 'false'
          # NO `registry-url`. It looks harmless and is not: setup-node writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an npmrc
          # UNCONDITIONALLY and points NPM_CONFIG_USERCONFIG at it, then exports
          # NODE_AUTH_TOKEN only if the caller supplied one — which, under OIDC,
          # nobody does. The job would publish with a config declaring a credential
          # that does not exist. This line was also half of the E404 mystery below:
          # it made the npmrc look authenticated when nothing was.

      # THE STEP WITHOUT WHICH THE OIDC CONFIGURATION IS CORRECT AND USELESS.
      # setup-node ships whatever npm the Node release bundles, and Node 22 bundles
      # npm 10.9.7, which has no OIDC code at all — measured in theokit-plugins by
      # unpacking the tarballs and grepping lib/ for ACTIONS_ID_TOKEN_REQUEST_URL:
      # 10.9.7 -> 0 files, 11.4.1 -> 0, 11.5.1 -> 2. Without it the CLI never
      # presents the OIDC token, publishes unauthenticated, and the registry answers
      # `E404 Not Found - PUT`.
      #
      # 11.9.0 and NOT 12.x. The comment below already records why an npm upgrade was
      # removed from this file: npm 12 rejects the `--no-git-checks` flag changesets
      # forwards for pnpm, with EUNKNOWNCONFIG. That line is npm 12, not npm 11 —
      # measured against one package on each version: 10.9.7 accepts, 11.5.1 accepts,
      # 11.9.0 accepts, 12.0.2 rejects. The OIDC floor is 11.5.1, so 11.9.0 satisfies
      # both constraints. npm 12 has a second, quieter bug: `npm info --json` returns
      # an ARRAY where earlier npm returned an object, so changesets reads no
      # published versions and tries to publish everything.
      - name: Install an npm that speaks OIDC (>= 11.5.1) but tolerates pnpm's forwarded flag
        uses: usetheokit/shared-workflows/actions/npm-oidc@v1 # zizmor: ignore[unpinned-uses]
      # #169 — an `npm install -g npm@latest` step used to sit here, and it kept this workflow red
      # from 2026-07-24 to 2026-08-06 (7 consecutive runs):
      #
      #   npm error code EUNKNOWNCONFIG / Unknown cli flag: --git-checks
      #
      # `changeset publish` always appends `--no-git-checks` for pnpm (`@changesets/cli`, any pnpm
      # major >= 5), pnpm forwards it verbatim to npm, and npm REJECTS unknown flags where npm 10
      # only warned. `@latest` upgraded npm past that line. The fix was not to drop the step — OIDC
      # needs a new npm — but to pin it, which is what the step above does.
      #
      # CORRECTION (2026-08-21): that line is npm 12, not npm 11, so the two requirements are NOT
      # mutually exclusive. Measured against one package on each version: 10.9.7 accepts, 11.5.1
      # accepts, 11.9.0 accepts, 12.0.2 rejects. The OIDC floor is 11.5.1, so any npm in
      # [11.5.1, 11.9.0] satisfies both. `theokit-di` runs exactly that pairing and published three
      # packages with provenance on 2026-08-21. See usetheokit/theokit-di#32.
      #
      # The step existed to enable tokenless OIDC trusted-publisher, which is what signs provenance.
      # It could not pay off WHEN THIS WAS WRITTEN: npm refuses provenance attestation for a private
      # source repository (E422), and this repository was private then. Measured at the time — no
      # published version of any package here has a non-null `dist.attestations`.
      #
      # CORRECTION (2026-08-21): the repository is public now (`private: false`), so that objection
      # has expired too. Both reasons for staying on token auth were true when written and neither
      # is true today.
      #
      # Not "downgrade pnpm instead": measured with `npm verbose argv`, pnpm 9.15 AND 10.15 forward
      # the flag identically, and `@changesets/cli@2.31.1` (latest) still injects it. That part
      # holds — the pairing that works is on the npm side, not the pnpm side.
      #
      # This workflow still authenticates with a token, and that token currently cannot publish:
      # run 32370544611 failed with `E404 Not Found - PUT .../theokit` against packages this
      # account owns, leaving `theokit` stuck at 0.48.14 while the repository is at 0.49.0. Moving
      # to OIDC removes the credential as a variable and is now reachable — it needs a Trusted
      # Publisher connection configured on npmjs.com per package, which cannot be done from here.
      # Tracked in #413.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm install` runs the root `prepare` script, which points core.hooksPath at `.githooks`,
      # arming the pre-commit secret scan on this runner. changesets then runs
      # `git commit -m "Version Packages"`, the hook fires, finds no `trufflehog` binary and fails
      # closed as designed — so the Version Packages PR is never created. This has not bitten here
      # yet only because the hook landed on 2026-08-20 and no version commit has run since.
      #
      # The hook is right to fail closed and wrong to be armed in this job: it exists for the commit
      # a PERSON makes, where CI can only catch a credential once it is already in history. This one
      # is a bot committing generated content onto `changeset-release/main`, which reaches `main`
      # only through a pull request that secret-scan.yml is configured to scan base-to-head.
      #
      # `|| true` because --unset exits 5 when the key is absent, which is already the desired state.
      # Diagnosed in usetheokit/theokit-di#34, where it blocked a release.
      - name: Disarm the local pre-commit hook for the bot's version commit
        run: git config --unset core.hooksPath || true

      # usetheokit/theokit#191 — the version half, WITHOUT asking for a permission this
      # organization deliberately withholds.
      #
      # `changesets/action` decides internally between versioning and publishing, and on the version
      # branch it tries to OPEN A PULL REQUEST. That is forbidden here: measured 2026-08-23,
      # `can_approve_pull_request_reviews=false` on all ten repositories AND at the org level, so the
      # setting is not a per-repo oversight to flip — it is policy. The run failed there and never
      # reached publish.
      #
      # The two paths are mutually exclusive in a single run, so pre-empting the version case leaves
      # the publish path — the delicate one, carrying the trusted-publishing migration of #366/#413 —
      # byte-for-byte untouched below.
      #
      # A PAT (the issue's option b) would buy the capability back at the cost of a secret with an
      # owner. Pushing a branch needs no secret: the job already declares `contents: write`, and a
      # PERSON opens the PR from the link, which is the Rule 4 gate rather than a bot approving one.
      - name: Are there changesets waiting?
        id: pending
        run: echo "value=$(node scripts/pending-changesets.mjs)" >> "$GITHUB_OUTPUT"

      - name: Version Packages onto a branch
        if: steps.pending.outputs.value == 'true'
        run: |
          set -euo pipefail
          pnpm version-packages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C changeset-release/main
          git commit -am 'Version Packages'
          git push --force-with-lease -u origin changeset-release/main
          echo "::notice title=Version Packages::Ready to review — open the PR at https://github.com/${GITHUB_REPOSITORY}/compare/main...changeset-release/main?expand=1"

      - name: Create Release Pull Request or Publish
        if: steps.pending.outputs.value != 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # `pnpm release`, not `changeset publish` directly. The script wraps the publish in two
          # guards, and calling the CLI here left BOTH of them on the local path — the path a
          # release does not normally take:
          #
          #   check-pack-no-workspace.mjs      before  — no `workspace:*` escapes into a tarball
          #   verify-release-published.mjs     after   — every declared version is ON the registry
          #
          # The second is what #366 asked for, and wiring it into `pnpm release` while CI called
          # `changeset publish` would have made it decorative: the run that publishes nothing would
          # have gone on reporting success, which is the entire defect. Same reasoning
          # `theokit-sdk`'s workflow already records for its own guard.
          publish: pnpm release
          version: pnpm version-packages
        env:
          # The App's token, so the Version Packages pull request is authored by the App and
          # its required checks actually run. With `secrets.GITHUB_TOKEN` here the pull
          # request opens with nothing but the external Apps reporting and stays unmergeable
          # until a person closes and reopens it.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # NO npm credential of any kind, and this is the resolution of #169/#366
          # rather than a reversal of them.
          #
          # The history: the tokenless path was chosen for provenance, then reverted
          # because "npm refuses provenance for a private source repository (E422)"
          # — true at the time, and the comment named going public as the trigger to
          # migrate back. The repository is public now, and the rest of the
          # precondition list it wrote out has been met: `publishConfig.provenance`
          # sits in all six manifests, every one of them carries a Trusted Publisher
          # connection on npmjs.com naming this repository and THIS FILE, and the npm
          # pinned above is new enough to speak OIDC and old enough to tolerate the
          # flag changesets forwards.
          #
          # Both variables have to go, not just one. `changesets/action` reads
          # `process.env.NPM_TOKEN` and writes an authToken if it finds one;
          # `setup-node` wires its npmrc to `NODE_AUTH_TOKEN`. Either one present
          # means the npm CLI prefers token auth over the OIDC token from
          # `id-token: write`, the trusted-publisher binding is silently skipped, and
          # provenance goes with it — with no error to notice.
