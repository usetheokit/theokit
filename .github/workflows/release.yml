name: Release

# Per technical-hardening-sprint plan v1.1 T1.1 (UPDATE):
# Drop NPM_TOKEN env (EC-2 absorbed — disables OIDC trusted-publisher silently).
# Add id-token: write permission so changesets/action exchanges OIDC token
# with npm for provenance attestation.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# tsup builds DTS for theokit's ~24 entrypoints in a worker; the runner's default
# heap OOMs it (ERR_WORKER_OUT_OF_MEMORY). Raise the heap workflow-wide so the
# build step (and the changesets publish build) succeeds. Workers inherit NODE_OPTIONS.
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # #169 — the `npm install -g npm@latest` step that used to sit here is GONE, and with it the
      # failure that kept this workflow red from 2026-07-24 to 2026-08-06 (7 consecutive runs):
      #
      #   npm error code EUNKNOWNCONFIG / Unknown cli flag: --git-checks
      #
      # `changeset publish` always appends `--no-git-checks` for pnpm (`@changesets/cli`, any pnpm
      # major >= 5), pnpm forwards it verbatim to npm, and npm >= 11 REJECTS unknown flags where
      # npm 10 only warned. The step upgraded npm past that line, so the two requirements became
      # mutually exclusive at the pinned versions.
      #
      # The step existed to enable tokenless OIDC trusted-publisher, which is what signs provenance.
      # It cannot pay off here: npm refuses provenance attestation for a PRIVATE source repository
      # (E422), and this repo is private. Measured — no published version of any package in it has
      # a non-null `dist.attestations`, going back through every release. The requirement it served
      # was unreachable from day one.
      #
      # Not "downgrade pnpm instead": measured with `npm verbose argv`, pnpm 9.15 AND 10.15 forward
      # the flag identically, and `@changesets/cli@2.31.1` (latest) still injects it. There is no
      # version pairing that keeps both.
      #
      # Same posture as the sibling `theokit-sdk`, where token-auth is validated in production.
      - run: pnpm install --frozen-lockfile
      # The `Publish credential preflight` step (backlog B-M67-08) ran here and left with
      # `scripts/verify-publish-credential.mjs`. It refused a release the credential lacked the
      # AUTHORITY to finish — `npm whoami` succeeds for a read-only token, which is how the M67
      # release ran end to end (build, version, tag, GitHub release) and died on the last step with
      # `E404 ... PUT`, leaving `main` with a tag and a CHANGELOG announcing three versions that
      # were never published. That failure mode is possible again.
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          # `pnpm version-packages` is now plain `changeset version`: the template version sync went
          # away with `scripts/sync-template-versions.mjs`, and so did the pre-commit drift gate
          # that required it.
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # #169 — this used to read "NPM_TOKEN intentionally absent", because an NPM_TOKEN env
          # silently disables the OIDC trusted-publisher binding. That reasoning was sound and its
          # premise is not: the tokenless path buys provenance, and npm refuses provenance for a
          # private source repository (E422). The comment described a decision whose benefit this
          # repo could never collect, so it is reverted rather than left describing a policy that
          # no longer holds.
          #
          # `setup-node` above wired the registry `.npmrc` to read NODE_AUTH_TOKEN.
          #
          # Migration path, when this repo goes public: restore NPM_CONFIG_PROVENANCE + the
          # `publishConfig.provenance` fields, configure trusted publishers at
          # npmjs.com/package/<pkg>/settings, drop NODE_AUTH_TOKEN — and only then re-add an npm
          # upgrade, pinned to a version that tolerates pnpm's forwarded flag, or after changesets
          # stops injecting it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
