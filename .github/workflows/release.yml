name: Release

# Per technical-hardening-sprint plan v1.1 T1.1 (UPDATE):
# Drop NPM_TOKEN env (EC-2 absorbed — disables OIDC trusted-publisher silently).
# Add id-token: write permission so changesets/action exchanges OIDC token
# with npm for provenance attestation.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# tsup builds DTS for theokit's ~24 entrypoints in a worker; the runner's default
# heap OOMs it (ERR_WORKER_OUT_OF_MEMORY). Raise the heap workflow-wide so the
# build step (and the changesets publish build) succeeds. Workers inherit NODE_OPTIONS.
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # Node 22 bundles npm 10.x, which signs provenance but CANNOT authenticate
      # via OIDC trusted-publisher (tokenless publish needs npm >= 11.5.1). Without
      # this, `changeset publish` 404s on PUT even with a trusted publisher configured.
      - name: Upgrade npm for OIDC trusted-publisher (needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          # Use the repo's version-packages script (changeset version + sync:templates),
          # NOT bare `changeset version`. Bumping packages/theo/package.json triggers the
          # pre-commit `check:templates` gate; without syncing template versions first, the
          # "Version Packages" commit is rejected with "Template drift detected".
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN intentionally absent — per technical-hardening-sprint plan v1.1 EC-2
          # absorbed: NPM_TOKEN env DISABLES OIDC trusted-publisher binding silently.
          # Requires npm dashboard trusted-publisher binding at npmjs.com/package/<pkg>/settings.
          NPM_CONFIG_PROVENANCE: true
