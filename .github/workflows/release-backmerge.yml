name: Release back-merge

# B-M67-07 — carry the release state on `main` back to `workspace`.
#
# ## The failure this closes
#
# `release.yml` merges the "Version Packages" PR into `main` and publishes from there. `workspace`
# never learned. The next release computed its versions from a base that still had the consumed
# changeset files on disk and the pre-release numbers in each `package.json`, and produced a bump
# that had already shipped — measured in M67 on `@theokit/agents@7.5.0`.
#
# The drift is bidirectional and both directions were observed: versions on `main` that never came
# back, and a `chore(release)` commit living on `workspace` that never reached `main`.
#
# ## Why it targets `workspace` and not `develop`
#
# `.claude/rules/git-safety.md` § 1 is explicit: `develop` integrates work, it never originates it,
# and it advances only through the `workspace → develop` promotion PR. A back-merge landing directly
# on `develop` would break that rule. `workspace` is where work is born, so the release state lands
# there and reaches `develop` through the ordinary promotion — the same path as everything else.
#
# ## Why it merges and pushes instead of opening a PR
#
# The first version opened a PR, on the reasoning that a merge can conflict and a workflow which
# resolves conflicts unattended rewrites somebody's work without being asked. That reasoning still
# holds, but the mechanism does not: the repository has "Allow GitHub Actions to create and approve
# pull requests" turned off (`can_approve_pull_request_reviews: false`), so the very first run failed
# with `GitHub Actions is not permitted to create or approve pull requests`. A workflow that is red
# by default protects nothing — it trains the team to ignore red.
#
# So the conflict concern is honoured by the merge itself rather than by a PR: the job merges ONLY
# when git can do it with no conflict, and never resolves one. A conflict fails the job loudly, which
# is a legitimate red — something genuinely needs a human — not a red-by-default.
#
# Restoring the PR shape is a one-line change here, the day that repository setting is enabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace
          fetch-depth: 0
          # The default token is what pushes below. Pushes made with it do not trigger further
          # workflow runs, so this job cannot re-trigger itself.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into workspace, only when git can do it cleanly
        run: |
          set -euo pipefail
          git fetch origin main workspace

          # Nothing to carry: `workspace` already contains every commit on `main`.
          if [ -z "$(git rev-list HEAD..origin/main)" ]; then
            echo "workspace already contains main — nothing to back-merge"
            exit 0
          fi

          behind="$(git rev-list --count HEAD..origin/main)"
          echo "workspace is ${behind} commit(s) behind main"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `--no-ff` so the back-merge is always a visible commit in the history, and the audit
          # question "when did the release state reach workspace?" has an answer.
          if ! git merge --no-ff --no-edit origin/main -m "chore(release): back-merge main into workspace"; then
            git merge --abort || true
            echo "::error::main does not merge cleanly into workspace. Resolve it by hand: \
              git switch workspace && git merge origin/main. Until then the next release computes \
              its versions from a stale base — the failure mode measured in M67 on \
              @theokit/agents@7.5.0, which npm already had with different content."
            exit 1
          fi

          if ! git push origin HEAD:workspace; then
            echo "::error::the merge is clean but the push was rejected — workspace moved while this \
              job ran. Re-run the workflow, or merge by hand."
            exit 1
          fi
          echo "back-merged ${behind} commit(s) from main into workspace"
